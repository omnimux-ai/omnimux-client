<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmniMux 固定左侧导航轨与首页工作区会话栏演示</title>
  <style>
    /* ── DSH 真实语义 Token（对齐 ui-theme/src/styles/design-platform.css 与 dsh-ui-kit/src/motion/tokens.ts） ── */
    :root {
      --omnimux-motion-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --omnimux-motion-ease-spatial: cubic-bezier(0.32, 0.72, 0, 1);
      --omnimux-motion-dur-press: 90ms;
      --omnimux-motion-dur-fast: 140ms;
      --omnimux-motion-dur-base: 200ms;
      --omnimux-motion-press-scale: 0.96;

      --dsw-static-deepseek-400: rgb(122, 170, 255);
      --dsw-static-deepseek-450: rgb(86, 134, 254);
      --dsw-static-deepseek-500: rgb(65, 118, 230);
      --dsw-static-green-400: rgb(78, 209, 126);
      --dsw-static-green-500: rgb(34, 197, 94);
      --dsw-static-amber-400: rgb(247, 173, 49);
      --dsw-static-red-400: rgb(242, 90, 90);
      --dsw-static-violet-400: rgb(167, 139, 250);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page-backdrop: rgb(11, 12, 14);
      --demo-bar-bg: rgb(22, 23, 26);
      --demo-bar-border: rgba(255, 255, 255, 0.12);
      --dsw-alias-bg-base: rgb(21, 21, 23);
      --dsw-alias-bg-layer-1: rgb(35, 35, 36);
      --dsw-alias-bg-layer-2: rgb(44, 44, 46);
      --dsw-alias-bg-layer-3: rgb(53, 54, 56);
      --dsw-alias-bg-mask-1: rgba(0, 0, 0, 0.56);
      --dsw-specific-sidebar-fill: rgb(27, 27, 28);
      --dsw-specific-nav-rail-fill: rgb(23, 23, 25);
      --dsw-specific-sidebar-nav-item-active: rgba(255, 255, 255, 0.12);
      --dsw-specific-input-major: rgb(36, 37, 40);
      --dsw-specific-bubble: rgb(36, 37, 40);
      --dsw-alias-card-fill: rgb(30, 31, 34);
      --dsw-alias-card-fill-hover: rgb(39, 40, 44);
      --dsw-alias-label-primary: rgb(249, 250, 251);
      --dsw-alias-label-secondary: rgb(207, 211, 214);
      --dsw-alias-label-tertiary: rgb(151, 157, 166);
      --dsw-alias-border-l1: rgba(255, 255, 255, 0.08);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.13);
      --dsw-alias-border-l3: rgba(255, 255, 255, 0.18);
      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
      --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.14);
      --dsw-alias-button-primary-fill: rgb(245, 247, 250);
      --dsw-alias-button-primary-label: rgb(15, 17, 21);
      --dsw-alias-button-floating-hover: rgb(53, 54, 56);
      --dsw-alias-tooltip-bg: rgb(56, 58, 62);
      --dsw-alias-tooltip-label: rgb(255, 255, 255);
      --dsw-alias-state-business-primary: rgb(122, 170, 255);
      --dsw-alias-state-business-tertiary: rgba(86, 134, 254, 0.18);
      --dsw-alias-state-success-primary: rgb(78, 209, 126);
      --dsw-alias-state-success-tertiary: rgba(34, 197, 94, 0.16);
      --dsw-alias-state-warn-label: rgb(247, 173, 49);
      --dsw-alias-state-warn-tertiary: rgba(245, 158, 11, 0.16);
      --window-shadow: 0 28px 80px rgba(0, 0, 0, 0.65);
      --popover-shadow: 0 16px 40px rgba(0, 0, 0, 0.56);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --page-backdrop: rgb(236, 239, 244);
      --demo-bar-bg: rgb(255, 255, 255);
      --demo-bar-border: rgba(15, 17, 21, 0.12);
      --dsw-alias-bg-base: rgb(255, 255, 255);
      --dsw-alias-bg-layer-1: rgb(255, 255, 255);
      --dsw-alias-bg-layer-2: rgb(255, 255, 255);
      --dsw-alias-bg-layer-3: rgb(245, 246, 248);
      --dsw-alias-bg-mask-1: rgba(15, 17, 21, 0.28);
      --dsw-specific-sidebar-fill: rgb(245, 247, 250);
      --dsw-specific-nav-rail-fill: rgb(239, 242, 246);
      --dsw-specific-sidebar-nav-item-active: rgba(38, 49, 72, 0.11);
      --dsw-specific-input-major: rgb(255, 255, 255);
      --dsw-specific-bubble: rgb(237, 243, 254);
      --dsw-alias-card-fill: rgb(249, 250, 251);
      --dsw-alias-card-fill-hover: rgb(241, 243, 245);
      --dsw-alias-label-primary: rgb(15, 17, 21);
      --dsw-alias-label-secondary: rgb(74, 79, 86);
      --dsw-alias-label-tertiary: rgb(97, 102, 107);
      --dsw-alias-border-l1: rgba(15, 17, 21, 0.08);
      --dsw-alias-border-l2: rgba(15, 17, 21, 0.12);
      --dsw-alias-border-l3: rgba(15, 17, 21, 0.16);
      --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.07);
      --dsw-alias-interactive-bg-active: rgba(38, 49, 72, 0.12);
      --dsw-alias-button-primary-fill: rgb(15, 17, 21);
      --dsw-alias-button-primary-label: rgb(255, 255, 255);
      --dsw-alias-button-floating-hover: rgb(235, 238, 242);
      --dsw-alias-tooltip-bg: rgb(35, 35, 36);
      --dsw-alias-tooltip-label: rgb(255, 255, 255);
      --dsw-alias-state-business-primary: rgb(37, 99, 235);
      --dsw-alias-state-business-tertiary: rgb(228, 237, 253);
      --dsw-alias-state-success-primary: rgb(20, 108, 53);
      --dsw-alias-state-success-tertiary: rgb(230, 250, 237);
      --dsw-alias-state-warn-label: rgb(161, 88, 12);
      --dsw-alias-state-warn-tertiary: rgb(254, 245, 231);
      --window-shadow: 0 24px 64px rgba(15, 23, 42, 0.16);
      --popover-shadow: 0 14px 36px rgba(15, 23, 42, 0.14);
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --omnimux-motion-dur-press: 0ms;
        --omnimux-motion-dur-fast: 0ms;
        --omnimux-motion-dur-base: 0ms;
        --omnimux-motion-press-scale: 1;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-backdrop);
      color: var(--dsw-alias-label-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    button {
      font-family: inherit;
      color: inherit;
    }

    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--dsw-alias-state-business-primary);
      outline-offset: 2px;
    }

    /* ── 顶部演示控制条（仅用于审阅状态切换，不属于桌面壳本体） ── */
    .demo-toolbar {
      position: sticky;
      top: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 20px;
      background: var(--demo-bar-bg);
      border-bottom: 1px solid var(--demo-bar-border);
    }

    .demo-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .demo-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .demo-status-pill {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--dsw-alias-state-business-tertiary);
      color: var(--dsw-alias-state-business-primary);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .demo-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .seg-group {
      display: inline-flex;
      padding: 2px;
      border-radius: 10px;
      background: var(--dsw-specific-sidebar-fill);
      border: 1px solid var(--demo-bar-border);
      gap: 2px;
    }

    .seg-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  color var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  transform var(--omnimux-motion-dur-press) var(--omnimux-motion-ease-out);
    }

    .seg-btn:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .seg-btn:active {
      transform: scale(var(--omnimux-motion-press-scale));
    }

    .seg-btn[aria-pressed="true"] {
      background: var(--dsw-alias-button-primary-fill);
      color: var(--dsw-alias-button-primary-label);
    }

    /* ── 窗口舞台容器 ── */
    .stage-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 0;
    }

    .desktop-window {
      position: relative;
      width: 100%;
      max-width: 1360px;
      height: 760px;
      border-radius: 14px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-base);
      box-shadow: var(--window-shadow);
      overflow: hidden;
      display: flex;
      transition: max-width var(--omnimux-motion-dur-base) var(--omnimux-motion-ease-spatial);
    }

    .desktop-window[data-viewport="narrow"] {
      max-width: 720px;
      height: 720px;
    }

    /* macOS 原生红绿灯（固定在窗口左上角 x:16..68, y:18） */
    .traffic-lights {
      position: absolute;
      top: 18px;
      left: 16px;
      z-index: 320;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .tl-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .tl-red { background: rgb(255, 95, 87); }
    .tl-yellow { background: rgb(254, 188, 46); }
    .tl-green { background: rgb(40, 200, 64); }

    /* ── 最左固定导航轨（52px） ── */
    .nav-rail {
      position: relative;
      flex: none;
      width: 52px;
      height: 100%;
      background: var(--dsw-specific-nav-rail-fill);
      border-right: 1px solid var(--dsw-alias-border-l1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0 12px;
      z-index: 220;
    }

    .desktop-window[data-arch="before"] .nav-rail {
      display: none;
    }

    .rail-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .rail-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding-top: 8px;
    }

    .rail-divider {
      width: 24px;
      height: 1px;
      background: var(--dsw-alias-border-l2);
      margin: 2px 0;
    }

    .rail-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  color var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  transform var(--omnimux-motion-dur-press) var(--omnimux-motion-ease-out);
    }

    .rail-btn:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .rail-btn:active {
      transform: scale(var(--omnimux-motion-press-scale));
    }

    .rail-btn[data-active="true"] {
      background: var(--dsw-specific-sidebar-nav-item-active);
      color: var(--dsw-alias-label-primary);
      box-shadow: inset 0 0 0 1px var(--dsw-alias-border-l2);
    }

    .rail-btn svg {
      width: 18px;
      height: 18px;
      flex: none;
    }

    /* Tooltip 仅悬停或键盘聚焦显示 */
    .rail-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%) translateX(-4px);
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--dsw-alias-tooltip-bg);
      color: var(--dsw-alias-tooltip-label);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      box-shadow: var(--popover-shadow);
      opacity: 0;
      pointer-events: none;
      z-index: 420;
      transition: opacity var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  transform var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out);
    }

    .rail-btn[data-tooltip]:hover::after,
    .rail-btn[data-tooltip]:focus-visible::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .update-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dsw-static-green-500);
      border: 1.5px solid var(--dsw-specific-nav-rail-fill);
    }

    .avatar-chip {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--dsw-alias-state-business-primary);
      color: rgb(255, 255, 255);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 第二层：Agent 工作区会话栏（264px） ── */
    .session-sidebar {
      flex: none;
      width: 264px;
      height: 100%;
      background: var(--dsw-specific-sidebar-fill);
      border-right: 1px solid var(--dsw-alias-border-l1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width var(--omnimux-motion-dur-base) var(--omnimux-motion-ease-spatial),
                  opacity var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out);
    }

    .desktop-window[data-arch="after"][data-session-open="false"] .session-sidebar {
      width: 0;
      border-right-width: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 窄屏下首页会话栏以 left: 52px 抽屉滑出 */
    .desktop-window[data-arch="after"][data-viewport="narrow"] .session-sidebar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 52px;
      width: 264px;
      z-index: 210;
      opacity: 1;
      visibility: visible;
      box-shadow: var(--window-shadow);
      transform: translateX(0);
      transition: transform var(--omnimux-motion-dur-base) var(--omnimux-motion-ease-spatial),
                  visibility 0s linear 0s;
    }

    .desktop-window[data-arch="after"][data-viewport="narrow"][data-session-open="false"] .session-sidebar {
      width: 264px;
      visibility: hidden;
      transform: translateX(-110%);
      pointer-events: none;
      transition: transform var(--omnimux-motion-dur-base) var(--omnimux-motion-ease-spatial),
                  visibility 0s linear var(--omnimux-motion-dur-base);
    }

    .drawer-scrim {
      display: none;
      position: absolute;
      inset: 0 0 0 52px;
      background: var(--dsw-alias-bg-mask-1);
      z-index: 200;
    }

    .desktop-window[data-arch="after"][data-viewport="narrow"][data-session-open="true"] .drawer-scrim {
      display: block;
    }

    /* 改前模式下，单层侧栏缩窄或折叠的表现 */
    .desktop-window[data-arch="before"][data-before-collapsed="true"] .session-sidebar {
      width: 0;
      border-right-width: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .sidebar-top-clearance {
      flex: none;
      height: 48px;
    }

    .sidebar-brand-row {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 10px 14px;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--dsw-alias-label-primary);
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--dsw-static-deepseek-500);
      color: rgb(255, 255, 255);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .sidebar-cta-wrap {
      flex: none;
      padding: 0 10px 10px;
      display: flex;
      gap: 8px;
    }

    .new-chat-btn {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-base);
      color: var(--dsw-alias-label-primary);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  transform var(--omnimux-motion-dur-press) var(--omnimux-motion-ease-out);
    }

    .new-chat-btn:hover {
      background: var(--dsw-alias-card-fill-hover);
    }

    .new-chat-btn:active {
      transform: scale(var(--omnimux-motion-press-scale));
    }

    .new-chat-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .kbd-hint {
      font-size: 12px;
      color: var(--dsw-alias-label-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .before-new-proj-btn {
      display: none;
      flex: 1;
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: transparent;
      color: var(--dsw-alias-label-primary);
      font-size: 13px;
      font-weight: 500;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .desktop-window[data-arch="before"] .before-new-proj-btn {
      display: inline-flex;
    }

    .desktop-window[data-arch="before"] .kbd-hint {
      display: none;
    }

    /* 改前模式下的一级混排导航 */
    .before-legacy-nav {
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 0 6px 10px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--dsw-alias-border-l1);
    }

    .desktop-window[data-arch="before"] .before-legacy-nav {
      display: flex;
    }

    .legacy-nav-item {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--dsw-alias-label-primary);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .legacy-nav-item:hover {
      background: var(--dsw-alias-interactive-bg-hover);
    }

    .legacy-nav-item[data-active="true"] {
      background: var(--dsw-alias-interactive-bg-active);
      font-weight: 500;
    }

    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 6px 14px;
    }

    .tree-group-title {
      padding: 8px 10px 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--dsw-alias-label-tertiary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .session-row {
      width: 100%;
      min-height: 36px;
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      transition: background var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  color var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out);
    }

    .session-row:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .session-row[data-active="true"] {
      background: var(--dsw-alias-interactive-bg-active);
      color: var(--dsw-alias-label-primary);
      font-weight: 500;
    }

    .session-row-left {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .session-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-time {
      flex: none;
      font-size: 12px;
      color: var(--dsw-alias-label-tertiary);
      font-variant-numeric: tabular-nums;
    }

    /* 改前模式底部区域（改后彻底清空） */
    .before-sidebar-footer {
      display: none;
      flex: none;
      padding: 8px 8px 10px;
      border-top: 1px solid var(--dsw-alias-border-l1);
      flex-direction: column;
      gap: 4px;
    }

    .desktop-window[data-arch="before"] .before-sidebar-footer {
      display: flex;
    }

    /* ── 顶栏浮层控制（macOS 红绿灯右侧 x: 84px） ── */
    .topbar-leading-controls {
      position: absolute;
      top: 6px;
      left: 84px;
      z-index: 260;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-leading-controls[hidden] {
      display: none;
    }

    .topbar-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  color var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  transform var(--omnimux-motion-dur-press) var(--omnimux-motion-ease-out);
    }

    .topbar-icon-btn:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .topbar-icon-btn:active {
      transform: scale(var(--omnimux-motion-press-scale));
    }

    .topbar-icon-btn[hidden] {
      display: none;
    }

    /* ── 主舞台与分屏 ── */
    .main-stage {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: var(--dsw-alias-bg-base);
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .stage-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .stage-pane[hidden] {
      display: none;
    }

    .stage-header {
      flex: none;
      height: 48px;
      padding: 0 18px;
      border-bottom: 1px solid var(--dsw-alias-border-l1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: padding-left var(--omnimux-motion-dur-base) var(--omnimux-motion-ease-spatial);
    }

    /* 当顶栏左侧有折叠钮/红绿灯避让时，主舞台顶部左内边距自动让位 */
    .desktop-window[data-arch="after"][data-needs-leading-pad="true"] .stage-header {
      padding-left: 124px;
    }

    /* 非首页业务页时虽无折叠钮，仍需避让跨出 52px 轨的 macOS 绿色红绿灯（x=68px） */
    .desktop-window[data-arch="after"][data-needs-traffic-pad="true"] .stage-header {
      padding-left: 34px;
    }

    .desktop-window[data-arch="before"][data-before-collapsed="true"] .stage-header {
      padding-left: 170px;
    }

    .stage-header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .stage-header-title h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .btn-ghost {
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: transparent;
      color: var(--dsw-alias-label-primary);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  transform var(--omnimux-motion-dur-press) var(--omnimux-motion-ease-out);
    }

    .btn-ghost:hover {
      background: var(--dsw-alias-interactive-bg-hover);
    }

    .btn-ghost:active {
      transform: scale(var(--omnimux-motion-press-scale));
    }

    .btn-primary {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: none;
      background: var(--dsw-alias-button-primary-fill);
      color: var(--dsw-alias-button-primary-label);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out),
                  transform var(--omnimux-motion-dur-press) var(--omnimux-motion-ease-out);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-primary:active {
      transform: scale(var(--omnimux-motion-press-scale));
    }

    /* ── 对话区内容 ── */
    .chat-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-user {
      align-self: flex-end;
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--dsw-specific-bubble);
      color: var(--dsw-alias-label-primary);
      font-size: 14px;
      line-height: 1.55;
    }

    .msg-agent {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--dsw-alias-label-primary);
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--dsw-alias-card-fill);
    }

    .step-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dsw-alias-label-secondary);
    }

    .step-ok {
      color: var(--dsw-alias-state-success-primary);
      display: inline-flex;
    }

    .composer-dock {
      flex: none;
      padding: 0 24px 20px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .composer-box {
      border-radius: 16px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-specific-input-major);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .composer-input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--dsw-alias-label-primary);
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .composer-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .pill-btn:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--dsw-alias-button-primary-fill);
      color: var(--dsw-alias-button-primary-label);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* ── 业务工作台页面（项目 / 技能专家 / 资产库 / 灵感社区 / 更多子页） ── */
    .workspace-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-pill {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--dsw-alias-border-l1);
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-pill:hover {
      background: var(--dsw-alias-interactive-bg-hover);
      color: var(--dsw-alias-label-primary);
    }

    .filter-pill[aria-pressed="true"] {
      background: var(--dsw-specific-sidebar-nav-item-active);
      border-color: transparent;
      color: var(--dsw-alias-label-primary);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
      gap: 14px;
    }

    .work-card {
      border-radius: 12px;
      background: var(--dsw-alias-card-fill);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid var(--dsw-alias-border-l1);
      transition: background var(--omnimux-motion-dur-fast) var(--omnimux-motion-ease-out);
    }

    .work-card:hover {
      background: var(--dsw-alias-card-fill-hover);
    }

    .work-thumb {
      height: 112px;
      border-radius: 8px;
      background: var(--dsw-specific-sidebar-fill);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dsw-alias-label-tertiary);
    }

    .work-card-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--dsw-alias-label-primary);
    }

    .work-card-meta {
      margin: 0;
      font-size: 12px;
      color: var(--dsw-alias-label-tertiary);
      font-variant-numeric: tabular-nums;
    }

    /* ── 右栏分屏工作台（与对话并行） ── */
    .split-rightbar {
      width: 62%;
      min-width: 360px;
      border-left: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-base);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .split-rightbar[hidden] {
      display: none;
    }

    .rightbar-tabs {
      flex: none;
      height: 48px;
      padding: 0 12px;
      border-bottom: 1px solid var(--dsw-alias-border-l1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rightbar-tab-list {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .rightbar-tab {
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: none;
      background: var(--dsw-specific-sidebar-nav-item-active);
      color: var(--dsw-alias-label-primary);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .canvas-preview {
      flex: 1;
      padding: 20px;
      background: var(--dsw-specific-sidebar-fill);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-content: start;
      overflow-y: auto;
    }

    .desktop-window[data-viewport="narrow"] .split-rightbar {
      width: 56%;
      min-width: 240px;
    }

    .desktop-window[data-viewport="narrow"] .canvas-preview {
      grid-template-columns: 1fr;
    }

    /* ── 「更多」右侧弹出菜单（实体不透明底） ── */
    .more-popover {
      position: absolute;
      left: 60px;
      top: 224px;
      z-index: 400;
      width: 224px;
      max-height: calc(100% - 24px);
      overflow-y: auto;
      padding: 6px;
      border-radius: 12px;
      background: var(--dsw-alias-bg-layer-2);
      border: 1px solid var(--dsw-alias-border-l2);
      box-shadow: var(--popover-shadow);
    }

    .more-popover[hidden] {
      display: none;
    }

    .desktop-window[data-arch="before"] .more-popover {
      left: 272px;
      top: 240px;
    }

    .menu-row {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--dsw-alias-label-primary);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .menu-row:hover {
      background: var(--dsw-alias-interactive-bg-hover);
    }

    .menu-row[data-current="true"] {
      background: var(--dsw-alias-interactive-bg-active);
      font-weight: 500;
    }

    .menu-row-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .menu-sep {
      height: 1px;
      background: var(--dsw-alias-border-l1);
      margin: 5px 6px;
    }

    .alpha-pill {
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--dsw-alias-border-l2);
      color: var(--dsw-alias-label-tertiary);
      font-size: 12px;
      line-height: 1.2;
      flex: none;
    }

    /* ── 底部系统弹窗（设置 / 远程控制 / 更新 / 新建项目） ── */
    .system-popover {
      position: absolute;
      left: 60px;
      bottom: 14px;
      z-index: 410;
      width: 300px;
      padding: 14px;
      border-radius: 12px;
      background: var(--dsw-alias-bg-layer-2);
      border: 1px solid var(--dsw-alias-border-l2);
      box-shadow: var(--popover-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .system-popover[hidden] {
      display: none;
    }

    .system-pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .system-pop-head h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .system-pop-desc {
      margin: 0;
      font-size: 13px;
      color: var(--dsw-alias-label-secondary);
      line-height: 1.5;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 430;
      background: var(--dsw-alias-bg-mask-1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      padding: 18px;
      border-radius: 14px;
      background: var(--dsw-alias-bg-layer-2);
      border: 1px solid var(--dsw-alias-border-l2);
      box-shadow: var(--popover-shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-input {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--dsw-alias-border-l2);
      background: var(--dsw-alias-bg-base);
      color: var(--dsw-alias-label-primary);
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>

      <div class="seg-group" role="group" aria-label="发布渠道">

        <button type="button" class="seg-btn" id="btnChannelDev" aria-pressed="false">开发版</button>

    </div>
  </header>

        const visibleItems = MORE_ITEMS.filter((it) => state.channel === "dev" || !it.alpha);
        visibleItems.forEach((item, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "menu-row";
          row.setAttribute("role", "menuitem");
          const isCurrent = state.activeNav === "more" && state.activeMoreId === item.id;
          row.dataset.current = isCurrent ? "true" : "false";
          row.innerHTML = `
            <span class="menu-row-left">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                ${isCurrent ? '<path d="m3.5 8.5 3 3 6-6.5"/>' : '<rect x="2.5" y="2.5" width="11" height="11" rx="2"/>'}
              </svg>
              <span class="menu-label"></span>
            </span>
          `;
          row.querySelector(".menu-label").textContent = item.label;
          if (item.alpha) {
            const badge = document.createElement("span");
            badge.className = "alpha-pill";
            badge.textContent = "Alpha";
            row.appendChild(badge);
          }
          row.addEventListener("click", () => {
            state.moreMenuOpen = false;
            state.activeNav = "more";
            state.activeMoreId = item.id;
            state.activeFilterIdx = 0;
            state.splitOpen = false;
            if (state.arch === "after") {
              state.sessionSidebarOpen = false;
            }
            render();
          });
          elMorePopover.appendChild(row);

          const next = visibleItems[index + 1];
          if (item.dividerAfter && next) {
            const sep = document.createElement("div");
            sep.className = "menu-sep";
            elMorePopover.appendChild(sep);
          }
        });
        elMorePopover.hidden = !state.moreMenuOpen;
        elRailMore.setAttribute("aria-expanded", String(state.moreMenuOpen));
        if (state.moreMenuOpen) {
          const winRect = elWindow.getBoundingClientRect();
          const anchorEl = state.arch === "after" ? elRailMore : document.getElementById("btnBeforeMore");
          const anchorRect = anchorEl.getBoundingClientRect();
          const popRect = elMorePopover.getBoundingClientRect();
          const margin = 12;
          const rawTop = Math.round(anchorRect.top - winRect.top);
          const maxTop = Math.max(margin, Math.round(winRect.height - popRect.height - margin));
          elMorePopover.style.top = `${Math.max(margin, Math.min(rawTop, maxTop))}px`;
        }
      }

      function renderBusinessPage() {
        const isMore = state.activeNav === "more";
        const moreMeta = isMore ? MORE_ITEMS.find((i) => i.id === state.activeMoreId) || MORE_ITEMS[0] : null;
        const pageMeta = isMore
          ? {
              title: moreMeta.label,
              filters: ["全部", "最近使用", "已启用"],
              splitTab: moreMeta.splitTab,
              cards: [
                { title: `${moreMeta.label} 任务流模板`, meta: "默认工作区  已就绪" },
                { title: `${moreMeta.label} 批处理任务`, meta: "运行中  2 个节点" },
                { title: `${moreMeta.label} 导出记录`, meta: "今天  3 份产物" },
              ],
            }
          : BIZ_PAGES[state.activeNav];

        if (!pageMeta) return;
        elBizTitle.textContent = pageMeta.title;
        elBizActions.innerHTML = "";

        if (state.activeNav === "projects") {
          const btnNewProj = document.createElement("button");
          btnNewProj.type = "button";
          btnNewProj.className = "btn-primary";
          btnNewProj.id = "btnInPageNewProject";
          btnNewProj.innerHTML = `
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
            <span>新建项目</span>
          `;
          btnNewProj.addEventListener("click", openNewProjectModal);
          elBizActions.appendChild(btnNewProj);
        }

        const btnSplitFromBiz = document.createElement("button");
        btnSplitFromBiz.type = "button";
        btnSplitFromBiz.className = "btn-ghost";
        btnSplitFromBiz.id = "btnBizToSplit";
        btnSplitFromBiz.setAttribute("aria-label", "展开对话与工作台分屏");
        btnSplitFromBiz.innerHTML = `
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="11" rx="2"/>
            <line x1="6.8" y1="2.5" x2="6.8" y2="13.5"/>
          </svg>
          <span>展开分屏</span>
        `;
        btnSplitFromBiz.addEventListener("click", () => {
          state.activeNav = "home";
          state.activeMoreId = null;
          state.splitOpen = true;
          state.splitTabTitle = pageMeta.splitTab;
          state.sessionSidebarOpen = false;
          render();
        });
        elBizActions.appendChild(btnSplitFromBiz);

        elBizBody.innerHTML = "";
        const filterStrip = document.createElement("div");
        filterStrip.className = "filter-strip";
        const pills = document.createElement("div");
        pills.className = "filter-pills";
        pageMeta.filters.forEach((label, idx) => {
          const pill = document.createElement("button");
          pill.type = "button";
          pill.className = "filter-pill";
          pill.textContent = label;
          pill.setAttribute("aria-pressed", String(state.activeFilterIdx === idx));
          pill.addEventListener("click", () => {
            state.activeFilterIdx = idx;
            renderBusinessPage();
          });
          pills.appendChild(pill);
        });
        filterStrip.appendChild(pills);
        elBizBody.appendChild(filterStrip);

        const grid = document.createElement("div");
        grid.className = "cards-grid";
        const cards = state.activeNav === "projects"
          ? state.projectsList.map((p) => ({ title: p.title, meta: `${p.pages}  ${p.updated}` }))
          : pageMeta.cards;
        cards.forEach((c) => {
          const card = document.createElement("article");
          card.className = "work-card";
          card.innerHTML = `
            <div class="work-thumb" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3" y="4" width="18" height="16" rx="2.5"/>
                <path d="M7 15l3.5-3.5 3 3 2.5-2.5 2 2"/>
              </svg>
            </div>
            <h3 class="work-card-title"></h3>
            <p class="work-card-meta"></p>
          `;
          card.querySelector(".work-card-title").textContent = c.title;
          card.querySelector(".work-card-meta").textContent = c.meta;
          grid.appendChild(card);
        });
        elBizBody.appendChild(grid);
      }

      function renderSplitCards() {
        elSplitGrid.innerHTML = "";
        ["分镜节点 1 对比开场", "分镜节点 2 商品特写", "排期节点 自动分发"].forEach((name, idx) => {
          const card = document.createElement("article");
          card.className = "work-card";
          card.innerHTML = `
            <div class="work-thumb" style="height:86px" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2.5"/></svg>
            </div>
            <h3 class="work-card-title"></h3>
            <p class="work-card-meta"></p>
          `;
          card.querySelector(".work-card-title").textContent = name;
          card.querySelector(".work-card-meta").textContent = idx === 2 ? "已完成排期" : "已同步素材";
          elSplitGrid.appendChild(card);
        });
      }

      function renderSystemPopover() {
        const titleEl = document.getElementById("sysPopTitle");
        const descEl = document.getElementById("sysPopDesc");
        const actionsEl = document.getElementById("sysPopActions");
        actionsEl.innerHTML = "";

        if (!state.sysPopoverKind) {
          elSysPopover.hidden = true;
          return;
        }
        elSysPopover.hidden = false;

        if (state.sysPopoverKind === "updates") {
          titleEl.textContent = "应用更新";
          descEl.textContent = "发现新版本可用，可随时安装更新，安装期间会保留当前项目与会话记录。";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-primary";
          btn.textContent = "立即检查";
          btn.addEventListener("click", () => { state.sysPopoverKind = null; render(); });
          actionsEl.appendChild(btn);
        } else if (state.sysPopoverKind === "remote") {
          titleEl.textContent = "远程控制";
          descEl.textContent = "通过手机端安全配对桌面工作区，离开电脑时也能查看运行状态与回复确认。";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-primary";
          btn.textContent = "生成配对码";
          btn.addEventListener("click", () => { state.sysPopoverKind = null; render(); });
          actionsEl.appendChild(btn);
        } else if (state.sysPopoverKind === "settings") {
          titleEl.textContent = "账号设置";
          descEl.textContent = "统一管理账号登录、模型渠道、工作区目录权限与插件运行开关。";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-primary";
          btn.textContent = "打开全局设置";
          btn.addEventListener("click", () => { state.sysPopoverKind = null; render(); });
          actionsEl.appendChild(btn);
        }
      }

      function openNewProjectModal() {
        document.getElementById("newProjectNameInput").value = "";
        elProjModal.hidden = false;
        setTimeout(() => document.getElementById("newProjectNameInput").focus(), 20);
      }

      function closeNewProjectModal() {
        elProjModal.hidden = true;
      }

      function computeStatusLabel() {
        if (state.arch === "before") {
          return state.beforeCollapsed ? "改前对照 侧栏已收起" : "改前对照 单层混合侧栏";
        }
        if (state.activeNav === "home") {
          if (state.splitOpen) {
            return state.sessionSidebarOpen ? "改后方案 分屏展开会话" : "改后方案 对话工作台分屏";
          }
          if (state.viewport === "narrow") {
            return state.sessionSidebarOpen ? "改后方案 窄屏抽屉展开" : "改后方案 窄屏首页收起";
          }
          return state.sessionSidebarOpen ? "改后方案 首页展开" : "改后方案 首页收起";
        }
        if (state.activeNav === "more") {
          const item = MORE_ITEMS.find((i) => i.id === state.activeMoreId);
          return `改后方案 更多 ${item ? item.label : ""}`.trim();
        }
        return `改后方案 ${BIZ_PAGES[state.activeNav]?.title || ""}`;
      }

      function render() {
        document.documentElement.setAttribute("data-theme", state.theme);
        elWindow.setAttribute("data-arch", state.arch);
        elWindow.setAttribute("data-viewport", state.viewport);
        elWindow.setAttribute("data-session-open", String(state.sessionSidebarOpen));
        elWindow.setAttribute("data-before-collapsed", String(state.beforeCollapsed));

        // 顶部对比栏按钮态
        document.getElementById("btnArchAfter").setAttribute("aria-pressed", String(state.arch === "after"));
        document.getElementById("btnArchBefore").setAttribute("aria-pressed", String(state.arch === "before"));
        document.getElementById("btnViewportWide").setAttribute("aria-pressed", String(state.viewport === "wide"));
        document.getElementById("btnViewportNarrow").setAttribute("aria-pressed", String(state.viewport === "narrow"));
        document.getElementById("btnThemeDark").setAttribute("aria-pressed", String(state.theme === "dark"));
        document.getElementById("btnThemeLight").setAttribute("aria-pressed", String(state.theme === "light"));
        document.getElementById("btnChannelProd").setAttribute("aria-pressed", String(state.channel === "prod"));
        document.getElementById("btnChannelDev").setAttribute("aria-pressed", String(state.channel === "dev"));
        elStateLabel.textContent = computeStatusLabel();

        // 固定轨激活位
        document.querySelectorAll(".rail-btn[data-nav]").forEach((btn) => {
          btn.dataset.active = btn.dataset.nav === state.activeNav ? "true" : "false";
        });

        // 改前旧侧栏激活位
        document.querySelectorAll(".legacy-nav-item[data-legacy-nav]").forEach((btn) => {
          btn.dataset.active = btn.dataset.legacyNav === state.activeNav ? "true" : "false";
        });

        // 顶栏折叠钮与收起态新对话钮显隐规则
        if (state.arch === "after") {
          const isHome = state.activeNav === "home";
          elTopbarControls.hidden = !isHome;
          const showTopbarNew = isHome && !state.sessionSidebarOpen;
          elBtnTopbarNew.hidden = !showTopbarNew;
          elBtnToggle.setAttribute("aria-label", state.sessionSidebarOpen ? "收起会话栏" : "展开会话栏");
          elWindow.setAttribute("data-needs-leading-pad", String(isHome && (!state.sessionSidebarOpen || state.viewport === "narrow")));
          elWindow.setAttribute("data-needs-traffic-pad", String(!isHome));
        } else {
          elTopbarControls.hidden = false;
          elBtnTopbarNew.hidden = !state.beforeCollapsed;
          elBtnToggle.setAttribute("aria-label", state.beforeCollapsed ? "展开侧边栏" : "收起侧边栏");
          elWindow.setAttribute("data-needs-leading-pad", "false");
          elWindow.setAttribute("data-needs-traffic-pad", "false");
        }

        // 主舞台切页（在改前对照下业务页也覆盖在右侧，但旧侧栏始终停留）
        const isHome = state.activeNav === "home";
        elPaneHome.hidden = !isHome;
        elPaneBiz.hidden = isHome;

        // 分屏右栏仅在首页分屏态下可见
        const showSplit = isHome && state.splitOpen;
        elSplitRightbar.hidden = !showSplit;
        elSplitBtnLabel.textContent = showSplit ? "收起分屏" : "打开分屏";
        elRightbarTabText.textContent = state.splitTabTitle;

        renderSessionLists();
        if (!isHome) renderBusinessPage();
        if (showSplit) renderSplitCards();
        renderMoreMenu();
        renderSystemPopover();
      }

      // ── 顶部控制条事件 ──
      document.getElementById("btnArchAfter").addEventListener("click", () => {
        state.arch = "after";
        state.moreMenuOpen = false;
        state.sysPopoverKind = null;
        if (state.activeNav === "home") {
          state.sessionSidebarOpen = !state.splitOpen && state.viewport === "wide";
        } else {
          state.sessionSidebarOpen = false;
        }
        render();
      });

      document.getElementById("btnArchBefore").addEventListener("click", () => {
        state.arch = "before";
        state.moreMenuOpen = false;
        state.sysPopoverKind = null;
        render();
      });

      document.getElementById("btnViewportWide").addEventListener("click", () => {
        state.viewport = "wide";
        if (state.arch === "after" && state.activeNav === "home" && !state.splitOpen) {
          state.sessionSidebarOpen = true;
        }
        render();
      });

      document.getElementById("btnViewportNarrow").addEventListener("click", () => {
        state.viewport = "narrow";
        state.sessionSidebarOpen = false;
        state.moreMenuOpen = false;
        render();
      });

      document.getElementById("btnThemeDark").addEventListener("click", () => {
        state.theme = "dark";
        render();
      });

      document.getElementById("btnThemeLight").addEventListener("click", () => {
        state.theme = "light";
        render();
      });

      document.getElementById("btnChannelProd").addEventListener("click", () => {
        state.channel = "prod";
        if (state.activeNav === "more") {
          const item = MORE_ITEMS.find((i) => i.id === state.activeMoreId);
          if (item?.alpha) {
            state.activeNav = "home";
            state.activeMoreId = null;
            state.sessionSidebarOpen = state.viewport === "wide";
          }
        }
        render();
      });

      document.getElementById("btnChannelDev").addEventListener("click", () => {
        state.channel = "dev";
        render();
      });

      // ── 固定导航轨点击（严格实现幂等回首页 + 非首页自动收起次级栏） ──
      document.getElementById("railHome").addEventListener("click", () => {
        state.moreMenuOpen = false;
        state.sysPopoverKind = null;
        state.activeNav = "home";
        state.activeMoreId = null;
        state.splitOpen = false;
        state.sessionSidebarOpen = true;
        render();
      });

      ["railProjects", "railMarket", "railAssets", "railInspiration"].forEach((id) => {
        document.getElementById(id).addEventListener("click", (ev) => {
          const nav = ev.currentTarget.dataset.nav;
          state.moreMenuOpen = false;
          state.sysPopoverKind = null;
          state.activeNav = nav;
          state.activeMoreId = null;
          state.activeFilterIdx = 0;
          state.splitOpen = false;
          state.sessionSidebarOpen = false;
          render();
        });
      });

      elRailMore.addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.sysPopoverKind = null;
        state.moreMenuOpen = !state.moreMenuOpen;
        renderMoreMenu();
      });

      // 底部全局系统入口
      document.getElementById("railUpdates").addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.moreMenuOpen = false;
        state.sysPopoverKind = state.sysPopoverKind === "updates" ? null : "updates";
        render();
      });

      document.getElementById("railRemote").addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.moreMenuOpen = false;
        state.sysPopoverKind = state.sysPopoverKind === "remote" ? null : "remote";
        render();
      });

      document.getElementById("railSettings").addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.moreMenuOpen = false;
        state.sysPopoverKind = state.sysPopoverKind === "settings" ? null : "settings";
        render();
      });

      document.getElementById("btnCloseSysPop").addEventListener("click", () => {
        state.sysPopoverKind = null;
        render();
      });

      // ── 顶栏折叠钮与新对话 ──
      elBtnToggle.addEventListener("click", () => {
        if (state.arch === "after") {
          state.sessionSidebarOpen = !state.sessionSidebarOpen;
        } else {
          state.beforeCollapsed = !state.beforeCollapsed;
        }
        render();
      });

      function createNewChat() {
        const nextId = `s${Date.now()}`;
        const nextTitle = `新对话 ${state.sessionsList.length}`;
        state.sessionsList.unshift({ id: nextId, ws: "omnimux-client", title: nextTitle, time: "刚刚" });
        state.activeSessionId = nextId;
        state.activeNav = "home";
        state.activeMoreId = null;
        document.getElementById("activeChatTitle").textContent = nextTitle;
        render();
      }

      document.getElementById("btnSidebarNewChat").addEventListener("click", createNewChat);
      elBtnTopbarNew.addEventListener("click", createNewChat);

      // ── 分屏按钮 ──
      document.getElementById("btnToggleSplit").addEventListener("click", () => {
        state.splitOpen = !state.splitOpen;
        if (state.splitOpen && state.arch === "after") {
          state.sessionSidebarOpen = false;
        }
        render();
      });

      document.getElementById("btnCloseRightbar").addEventListener("click", () => {
        state.splitOpen = false;
        if (state.arch === "after" && state.viewport === "wide") {
          state.sessionSidebarOpen = true;
        }
        render();
      });

      // ── 改前对照菜单点击 ──
      document.querySelectorAll(".legacy-nav-item[data-legacy-nav]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeNav = btn.dataset.legacyNav;
          state.activeMoreId = null;
          state.splitOpen = false;
          render();
        });
      });

      document.getElementById("btnBeforeMore").addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.moreMenuOpen = !state.moreMenuOpen;
        renderMoreMenu();
      });

      document.getElementById("btnBeforeNewProject").addEventListener("click", openNewProjectModal);
      document.getElementById("btnBeforeRemote").addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.sysPopoverKind = "remote";
        render();
      });
      document.getElementById("btnBeforeSettings").addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.sysPopoverKind = "settings";
        render();
      });

      // ── 新建项目弹窗 ──
      document.getElementById("btnCloseProjModal").addEventListener("click", closeNewProjectModal);
      document.getElementById("btnCancelProjModal").addEventListener("click", closeNewProjectModal);
      document.getElementById("btnConfirmProjModal").addEventListener("click", () => {
        const input = document.getElementById("newProjectNameInput");
        const val = input.value.trim();
        if (!val) return;
        state.projectsList.unshift({ id: `p${Date.now()}`, title: val, pages: "1 个创作页", updated: "刚刚" });
        closeNewProjectModal();
        render();
      });

      // ── 遮罩与 Esc 关闭 ──
      document.getElementById("drawerScrim").addEventListener("click", () => {
        state.sessionSidebarOpen = false;
        render();
      });

      document.addEventListener("click", (ev) => {
        if (state.moreMenuOpen && !elMorePopover.contains(ev.target) && ev.target !== elRailMore) {
          state.moreMenuOpen = false;
          renderMoreMenu();
        }
        if (state.sysPopoverKind && !elSysPopover.contains(ev.target) && !ev.target.closest(".rail-bottom")) {
          state.sysPopoverKind = null;
          renderSystemPopover();
        }
      });

      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") {
          if (!elProjModal.hidden) {
            closeNewProjectModal();
            return;
          }
          if (state.moreMenuOpen) {
            state.moreMenuOpen = false;
            renderMoreMenu();
            return;
          }
          if (state.sysPopoverKind) {
            state.sysPopoverKind = null;
            renderSystemPopover();
            return;
          }
          if (state.viewport === "narrow" && state.sessionSidebarOpen) {
            state.sessionSidebarOpen = false;
            render();
          }
        }
      });

      render();
    })();
  </script>
</body>
</html>
