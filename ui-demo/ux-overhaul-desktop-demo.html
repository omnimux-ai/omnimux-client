<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmniMux 桌面壳用户体验改造对比</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f1f3f6;
      --text: #16181d;
      --muted: #555c6a;
      --border: #dfe3eb;
      --primary: #17191f;
      --primary-fg: #ffffff;
      --danger-bg: #b42318;
      --danger-fg: #ffffff;
      --danger-border: #991b1b;
      --danger-text: #b42318;
      --danger-soft: rgba(180, 35, 24, 0.1);
      --ok: #146c35;
      --ok-soft: rgba(20, 108, 53, 0.12);
      --focus: #2563eb;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111317;
      --surface: #191c22;
      --surface-2: #22262f;
      --text: #eef1f6;
      --muted: #a1aab8;
      --border: #2c313c;
      --primary: #f1f5f9;
      --primary-fg: #111317;
      --danger-bg: #dc2626;
      --danger-fg: #ffffff;
      --danger-border: #ef4444;
      --danger-text: #fca5a5;
      --danger-soft: rgba(248, 113, 113, 0.18);
      --ok: #86efac;
      --ok-soft: rgba(74, 222, 128, 0.18);
      --focus: #60a5fa;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      -webkit-appearance: none;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 140ms ease, transform 80ms ease;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:active { transform: scale(0.96); }
    .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
    }
    .btn-primary:hover { opacity: 0.92; background: var(--primary); }
    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-fg);
      border-color: var(--danger-border);
    }
    .btn-danger:hover { opacity: 0.92; background: var(--danger-bg); }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .tab[aria-selected="true"] {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--muted);
    }
    .badge-bad { background: var(--danger-soft); color: var(--danger-text); }
    .badge-good { background: var(--ok-soft); color: var(--ok); }
    .surface-box {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .seg {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      background: var(--surface);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    .seg button[data-active="true"] {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--surface);
      min-width: 0;
    }
    .row code {
      overflow-wrap: anywhere;
      max-width: 100%;
    }
    .muted { color: var(--muted); font-size: 13px; margin: 0; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 40;
    }
    .modal-backdrop[data-open="true"] { display: flex; }
    .modal {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 12px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }
    .live-note {
      font-size: 13px;
      color: var(--ok);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>OmniMux 桌面壳体验改造对比</h1>
      <div class="controls">
        <button type="button" class="btn" id="themeToggle">切换深色主题</button>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="演示场景">
      <button type="button" class="btn tab" role="tab" aria-selected="true" data-scene="settings">设置体验</button>
      <button type="button" class="btn tab" role="tab" aria-selected="false" data-scene="confirm">确认反馈</button>
      <button type="button" class="btn tab" role="tab" aria-selected="false" data-scene="tray">托盘状态</button>
    </div>

    <main id="stage" class="grid"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" data-open="false" role="presentation">
    <div class="modal" id="modalDialog" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
      <h2 id="modalTitle" style="margin:0;font-size:16px;"></h2>
      <p id="modalDesc" class="muted"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">取消</button>
        <button type="button" class="btn btn-danger" id="modalConfirm"></button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      scene: 'settings',
      theme: 'light',
      browserAccess: false,
      lanStatus: 'loopback',
      actionLog: '',
    };

    const backdrop = document.getElementById('modalBackdrop');
    const modalDialog = document.getElementById('modalDialog');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalCancel = document.getElementById('modalCancel');
    const modalConfirm = document.getElementById('modalConfirm');
    const themeToggle = document.getElementById('themeToggle');
    let lastFocused = null;
    let lastFocusedId = null;

    function openConfirm({ title, desc, confirmLabel, onConfirm }) {
      lastFocused = document.activeElement;
      lastFocusedId = document.activeElement?.id || null;
      modalTitle.textContent = title;
      modalDesc.textContent = desc;
      modalConfirm.textContent = confirmLabel;
      backdrop.dataset.open = 'true';
      modalCancel.focus();
      modalConfirm.onclick = () => {
        onConfirm();
        closeConfirm();
      };
    }

    function closeConfirm() {
      backdrop.dataset.open = 'false';
      const restoreTarget = (lastFocusedId && document.getElementById(lastFocusedId)) || lastFocused;
      if (restoreTarget && typeof restoreTarget.focus === 'function') restoreTarget.focus();
    }

    modalCancel.onclick = closeConfirm;
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeConfirm(); });
    document.addEventListener('keydown', (e) => {
      if (backdrop.dataset.open !== 'true') return;
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeConfirm();
        return;
      }
      if (e.key === 'Tab') {
        const focusables = [...modalDialog.querySelectorAll('button:not(:disabled)')];
        if (focusables.length === 0) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        const active = document.activeElement;
        if (e.shiftKey) {
          if (active === first || !modalDialog.contains(active)) {
            e.preventDefault();
            last.focus();
          }
        } else if (active === last || !modalDialog.contains(active)) {
          e.preventDefault();
          first.focus();
        }
      }
    }, true);

    themeToggle.onclick = () => {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = state.theme;
      themeToggle.textContent = state.theme === 'light' ? '切换深色主题' : '切换浅色主题';
    };

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.scene = btn.dataset.scene;
        document.querySelectorAll('.tab').forEach((t) => {
          t.setAttribute('aria-selected', String(t === btn));
        });
        render();
      });
    });

    function render() {
      const stage = document.getElementById('stage');
      const activeId = document.activeElement instanceof HTMLElement && stage.contains(document.activeElement)
        ? document.activeElement.id
        : '';
      if (state.scene === 'settings') {
        stage.innerHTML = `
          <section class="card">
            <div class="card-head">
              <strong>改造前</strong>
              <span class="badge badge-bad">信息噪音与错位横幅</span>
            </div>
            <div class="surface-box">
              <div class="seg" aria-label="旧设置分类">
                <button type="button" data-active="true">通用</button>
                <button type="button">Profile 与数据</button>
                <button type="button">浏览器与局域网</button>
                <button type="button">诊断与恢复</button>
              </div>
              <div class="row"><span>允许在浏览器中打开</span><span class="badge">关闭</span></div>
              <div class="row"><span>局域网访问 Beta</span><span class="badge">禁用占位</span></div>
              <div class="row"><span>局域网 HTTPS 状态</span><span class="badge">未开启</span></div>
              <p class="muted">浏览器访问页签混入「插件市场设置已移至插件页面」冗余横幅，关闭访问后仍占据版面。</p>
            </div>
          </section>
          <section class="card">
            <div class="card-head">
              <strong>改造后</strong>
              <span class="badge badge-good">四字短名，渐进披露</span>
            </div>
            <div class="surface-box">
              <div class="seg" aria-label="新设置分类">
                <button type="button">通用</button>
                <button type="button">环境数据</button>
                <button type="button" data-active="true">远程访问</button>
                <button type="button">诊断恢复</button>
              </div>
              <div class="row">
                <span>允许在浏览器中打开</span>
                <button type="button" class="btn" id="toggleBrowser">${state.browserAccess ? '已开启' : '未开启'}</button>
              </div>
              ${state.browserAccess ? `
                <div class="row">
                  <span>局域网 HTTPS 访问</span>
                  <button type="button" class="btn" id="toggleLan">${state.lanStatus === 'loopback' ? '未开启' : '已开启'}</button>
                </div>
                <div class="row"><span>连接状态</span><span class="badge ${state.lanStatus === 'starting' ? '' : 'badge-good'}">${state.lanStatus === 'ready' ? '局域网已就绪' : state.lanStatus === 'starting' ? '启动中…' : '仅本机回环'}</span></div>
              ` : `<p class="muted">关闭浏览器访问时，局域网复杂选项与状态卡自动收起。</p>`}
            </div>
          </section>
        `;
        document.getElementById('toggleBrowser').onclick = () => {
          state.browserAccess = !state.browserAccess;
          if (!state.browserAccess) state.lanStatus = 'loopback';
          render();
        };
        const toggleLan = document.getElementById('toggleLan');
        if (toggleLan) {
          toggleLan.onclick = () => {
            if (state.lanStatus === 'loopback') {
              openConfirm({
                title: '开启局域网 HTTPS 访问？',
                desc: '同一网络下的可信设备将可通过 HTTPS 链接访问。',
                confirmLabel: '开启局域网访问',
                onConfirm: () => {
                  state.lanStatus = 'starting';
                  render();
                  setTimeout(() => {
                    if (state.lanStatus === 'starting') {
                      state.lanStatus = 'ready';
                      render();
                    }
                  }, 350);
                },
              });
            } else {
              state.lanStatus = 'loopback';
              render();
            }
          };
        }
      } else if (state.scene === 'confirm') {
        stage.innerHTML = `
          <section class="card">
            <div class="card-head">
              <strong>改造前</strong>
              <span class="badge badge-bad">模糊主按钮，内部术语</span>
            </div>
            <div class="surface-box">
              <div class="row"><span>重置全部数据</span><span class="badge">[继续 / 取消]</span></div>
              <div class="row"><span>移除非默认环境</span><span class="badge">[继续 / 取消]</span></div>
              <div class="row"><span>局域网警告窗</span><span class="badge">无 Esc / 无焦点隔离</span></div>
              <p class="muted">默认提示「将停止当前 Host，正在运行的任务会被中断」，所有危险动作按钮均裸写「继续」。</p>
            </div>
          </section>
          <section class="card">
            <div class="card-head">
              <strong>改造后</strong>
              <span class="badge badge-good">显式动宾，焦点闭环</span>
            </div>
            <div class="surface-box">
              <div class="row">
                <span>重置工作区数据</span>
                <button type="button" class="btn btn-danger" id="btnReset">重置数据并重启</button>
              </div>
              <div class="row">
                <span>移除非默认环境</span>
                <button type="button" class="btn" id="btnRemoveProfile">移除环境</button>
              </div>
              <div class="row">
                <span>更新下载失败反馈</span>
                <button type="button" class="btn" id="btnUpdateErr">模拟下载失败</button>
              </div>
              <div class="live-note" role="status">${state.actionLog}</div>
            </div>
          </section>
        `;
        document.getElementById('btnReset').onclick = () => openConfirm({
          title: '重置当前数据目录并重启？',
          desc: '环境、会话、设置和凭据将移入恢复备份目录，后台服务会停止并重新初始化。',
          confirmLabel: '重置数据并重启',
          onConfirm: () => { state.actionLog = '已按显式确认执行重置。'; render(); },
        });
        document.getElementById('btnRemoveProfile').onclick = () => openConfirm({
          title: '移除环境「staging」？',
          desc: '其文件将移入恢复备份目录，共享会话与设置会保留。',
          confirmLabel: '移除环境',
          onConfirm: () => { state.actionLog = '已按显式确认移除环境。'; render(); },
        });
        document.getElementById('btnUpdateErr').onclick = () => {
          state.actionLog = '下载更新失败：请检查网络连接后重试（不再静默吞错）。';
          render();
        };
      } else {
        stage.innerHTML = `
          <section class="card">
            <div class="card-head">
              <strong>改造前</strong>
              <span class="badge badge-bad">中点分隔，裸英文状态</span>
            </div>
            <div class="surface-box">
              <div class="row"><span>托盘提示</span><code>OmniMux · default · ready</code></div>
              <div class="row"><span>组件计数</span><code>共 1 个 · 1 运行中</code></div>
              <div class="row"><span>诊断导出命名</span><code>dsh-desktop-next-diagnostics-*.json</code></div>
            </div>
          </section>
          <section class="card">
            <div class="card-head">
              <strong>改造后</strong>
              <span class="badge badge-good">纯品牌、本地化可读状态</span>
            </div>
            <div class="surface-box">
              <div class="row"><span>托盘提示</span><span>OmniMux - desktop（运行中）</span></div>
              <div class="row"><span>组件计数</span><span>共 1 个，1 运行中</span></div>
              <div class="row"><span>诊断导出命名</span><span>omnimux-diagnostics-*.json（支持直达文件夹）</span></div>
            </div>
          </section>
        `;
      }
      if (activeId) {
        const nextFocus = document.getElementById(activeId);
        if (nextFocus && !nextFocus.disabled) nextFocus.focus();
      }
    }

    render();
  </script>
</body>
</html>
