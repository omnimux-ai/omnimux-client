<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>资产中心本地列表视图重构 — 前后对照演示</title>
<style>
/* Host real DSW tokens from @deepseek-ai/dsh-client-ui-theme design-platform.css */
body {
  --dsw-static-amber-100: rgb(254, 245, 231);
  --dsw-static-amber-500: rgb(245, 158, 11);
  --dsw-static-amber-600: rgb(221, 134, 41);
  --dsw-static-amber-900: rgb(39, 36, 31);
  --dsw-static-neutral-00: rgb(255, 255, 255);
  --dsw-static-neutral-50: rgb(250, 250, 250);
  --dsw-static-neutral-100: rgb(245, 245, 245);
  --dsw-static-neutral-850: rgb(33, 33, 35);
  --dsw-static-neutral-bluish-00: rgb(255, 255, 255);
  --dsw-static-neutral-bluish-50: rgb(249, 250, 251);
  --dsw-static-neutral-bluish-60: rgb(245, 246, 247);
  --dsw-static-neutral-bluish-75: rgb(241, 243, 245);
  --dsw-static-neutral-bluish-100: rgb(235, 238, 242);
  --dsw-static-neutral-bluish-300: rgb(207, 211, 214);
  --dsw-static-neutral-bluish-400: rgb(173, 178, 184);
  --dsw-static-neutral-bluish-600: rgb(129, 133, 140);
  --dsw-static-neutral-bluish-700: rgb(97, 102, 107);
  --dsw-static-neutral-bluish-750: rgb(67, 69, 74);
  --dsw-static-neutral-bluish-800: rgb(53, 54, 56);
  --dsw-static-neutral-bluish-850: rgb(44, 44, 46);
  --dsw-static-neutral-bluish-875: rgb(35, 35, 36);
  --dsw-static-neutral-bluish-900: rgb(27, 27, 28);
  --dsw-static-neutral-bluish-950: rgb(21, 21, 23);
  --dsw-static-neutral-bluish-1000: rgb(15, 17, 21);
  --dsw-static-red-400: rgb(242, 90, 90);
  --dsw-static-red-600: rgb(236, 19, 19);

  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-1: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-2: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-bg-layer-3: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-60);
  --dsw-alias-bg-multi-select: var(--dsw-static-neutral-bluish-60);
  --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
  --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
  --dsw-alias-border-l3: rgba(0, 0, 0, 0.12);
  --dsw-alias-border-l4: rgba(0, 0, 0, 0.16);
  --dsw-alias-brand-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-button-primary-fill: var(--dsw-alias-brand-primary);
  --dsw-alias-button-primary-hover: var(--dsw-static-neutral-bluish-750);
  --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
  --dsw-alias-interactive-bg-active: rgba(38, 49, 72, 0.1);
  --dsw-alias-interactive-bg-hover-danger: rgba(236, 19, 19, 0.05);
  --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-label-primary-foreground: var(--dsw-static-neutral-bluish-00);
  --dsw-alias-label-secondary: var(--dsw-static-neutral-bluish-700);
  --dsw-alias-label-tertiary: var(--dsw-static-neutral-bluish-600);
  --dsw-alias-state-warn-primary: var(--dsw-static-amber-500);
  --dsw-alias-state-warn-label: var(--dsw-static-amber-600);
  --dsw-alias-state-warn-tertiary: var(--dsw-static-amber-100);
  --dsw-alias-state-error-primary: var(--dsw-static-red-600);
  --dsw-shadow-lv2: 0 4px 16px rgba(15, 17, 21, 0.1);
  --dsw-shadow-lv3: 0 12px 32px rgba(15, 17, 21, 0.16);

  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  -webkit-font-smoothing: antialiased;
}

body[data-ds-dark-theme] {
  --dsw-alias-bg-base: var(--dsw-static-neutral-bluish-950);
  --dsw-alias-bg-layer-1: var(--dsw-static-neutral-bluish-875);
  --dsw-alias-bg-layer-2: var(--dsw-static-neutral-bluish-850);
  --dsw-alias-bg-layer-3: var(--dsw-static-neutral-bluish-800);
  --dsw-alias-bg-module-platform: var(--dsw-static-neutral-bluish-800);
  --dsw-alias-bg-multi-select: var(--dsw-static-neutral-850);
  --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
  --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
  --dsw-alias-border-l3: rgba(255, 255, 255, 0.16);
  --dsw-alias-border-l4: rgba(255, 255, 255, 0.2);
  --dsw-alias-brand-primary: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-button-primary-fill: var(--dsw-alias-brand-primary);
  --dsw-alias-button-primary-hover: var(--dsw-static-neutral-bluish-100);
  --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
  --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.14);
  --dsw-alias-interactive-bg-hover-danger: rgba(242, 90, 90, 0.15);
  --dsw-alias-label-primary: var(--dsw-static-neutral-bluish-50);
  --dsw-alias-label-primary-foreground: var(--dsw-static-neutral-bluish-1000);
  --dsw-alias-label-secondary: var(--dsw-static-neutral-bluish-300);
  --dsw-alias-label-tertiary: var(--dsw-static-neutral-bluish-400);
  --dsw-alias-state-warn-primary: var(--dsw-static-amber-500);
  --dsw-alias-state-warn-label: var(--dsw-static-amber-500);
  --dsw-alias-state-warn-tertiary: var(--dsw-static-amber-900);
  --dsw-alias-state-error-primary: var(--dsw-static-red-400);
  --dsw-shadow-lv2: 0 6px 20px rgba(0, 0, 0, 0.36);
  --dsw-shadow-lv3: 0 14px 36px rgba(0, 0, 0, 0.52);
}

* { box-sizing: border-box; }

/* Demo Harness Bar */
.demo-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 20px;
  background: var(--dsw-alias-bg-layer-2);
  border-bottom: 1px solid var(--dsw-alias-border-l2);
}
.demo-bar-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.demo-bar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
}
.demo-seg {
  display: inline-flex;
  padding: 2px;
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 8px;
  background: var(--dsw-alias-bg-base);
  gap: 2px;
}
.demo-btn {
  height: 28px;
  padding: 0 10px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease;
}
.demo-btn:hover { color: var(--dsw-alias-label-primary); background: var(--dsw-alias-interactive-bg-hover); }
.demo-btn.active {
  background: var(--dsw-alias-button-primary-fill);
  color: var(--dsw-alias-label-primary-foreground);
}

.demo-shell {
  margin: 20px auto 40px;
  padding: 0 20px;
  max-width: 1320px;
  transition: max-width 150ms ease;
}
.demo-shell[data-width="narrow"] {
  max-width: 780px;
}
.demo-stage-frame {
  border: 1px solid var(--dsw-alias-border-l2);
  border-radius: 12px;
  background: var(--dsw-alias-bg-base);
  overflow: hidden;
}

/* Mock Stage Header + Toolbar */
.stage-top {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--dsw-alias-border-l1);
}
.stage-title {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  line-height: 28px;
}
.stage-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--dsw-alias-border-l1);
  gap: 12px;
}
.stage-tabs {
  display: flex;
  gap: 18px;
  font-size: 13px;
}
.stage-tab {
  padding: 6px 0;
  color: var(--dsw-alias-label-tertiary);
  border-bottom: 2px solid transparent;
  font-weight: 500;
}
.stage-tab.active {
  color: var(--dsw-alias-label-primary);
  border-bottom-color: var(--dsw-alias-label-primary);
}
.stage-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 20px 6px;
}
.stage-chip {
  height: 28px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--dsw-alias-label-secondary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.stage-chip.active {
  background: var(--dsw-alias-interactive-bg-active);
  border-color: var(--dsw-alias-border-l3);
  color: var(--dsw-alias-label-primary);
  font-weight: 600;
}

/* Batch Selection Bar */
.omnimux-assets-selection {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 20px;
  background: var(--dsw-alias-bg-module-platform);
  border-bottom: 1px solid var(--dsw-alias-border-l2);
  font-size: 13px;
}
.omnimux-assets-selection-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-kit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 28px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease, transform 120ms ease;
}
.btn-kit:active { transform: scale(0.96); }
.btn-kit--primary {
  background: var(--dsw-alias-button-primary-fill);
  color: var(--dsw-alias-label-primary-foreground);
}
.btn-kit--primary:hover { background: var(--dsw-alias-button-primary-hover); }
.btn-kit--ghost {
  background: transparent;
  color: var(--dsw-alias-label-secondary);
}
.btn-kit--ghost:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
.btn-kit--danger {
  background: var(--dsw-alias-state-error-primary);
  color: var(--dsw-alias-label-primary-foreground);
}

.stage-main {
  padding: 12px 20px 20px;
}

/* ============================================================================
   BEFORE (Legacy Current Implementation)
   ============================================================================ */
.legacy-wrap { width: 100%; overflow-x: auto; }
.legacy-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: var(--dsw-alias-bg-layer-1);
}
.legacy-table th {
  text-align: left;
  padding: 8px 12px;
  color: var(--dsw-alias-label-tertiary);
  font-weight: 500;
  font-size: 12px;
  border-bottom: 1px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-layer-2);
}
.legacy-table td {
  padding: 10px 12px;
  vertical-align: middle;
  border-bottom: 1px solid var(--dsw-alias-border-l1);
}
.legacy-table tr:hover { background: var(--dsw-alias-interactive-bg-hover); }
.legacy-td-check { width: 40px; text-align: center; }
.legacy-td-name { min-width: 160px; font-weight: 500; }
.legacy-name-inner { display: flex; align-items: center; gap: 10px; }
.legacy-td-desc {
  color: var(--dsw-alias-label-secondary);
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.legacy-td-actions { width: 196px; text-align: right; }
.legacy-actions { display: inline-flex; gap: 6px; justify-content: flex-end; }
.legacy-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--dsw-alias-bg-module-platform);
  color: var(--dsw-alias-label-secondary);
  border: 1px solid var(--dsw-alias-border-l2);
}

/* ============================================================================
   AFTER (Redesigned Modern Desktop Asset List)
   ============================================================================ */
.omnimux-assets-list-wrap {
  width: 100%;
  overflow-x: auto;
  container-type: inline-size;
  container-name: assets-list;
}
.omnimux-assets-list-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 2px;
  table-layout: fixed;
  font-size: 13px;
  background: transparent;
  color: var(--dsw-alias-label-primary);
}
.omnimux-assets-list-table thead {
  background: transparent;
}
.omnimux-assets-list-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--dsw-alias-bg-base);
  padding: 8px 10px;
  height: 36px;
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
  border-bottom: 1px solid var(--dsw-alias-border-l2);
  text-align: left;
  user-select: none;
  white-space: nowrap;
}
.omnimux-assets-list-table th.omnimux-assets-th-check {
  width: 36px;
  padding: 8px 0 8px 10px;
  text-align: center;
}
.omnimux-assets-list-table th.omnimux-assets-th-name {
  width: 30%;
  min-width: 220px;
}
.omnimux-assets-list-table th.omnimux-assets-th-type {
  width: 88px;
}
.omnimux-assets-list-table th.omnimux-assets-th-desc {
  width: auto;
}
.omnimux-assets-list-table th.omnimux-assets-th-files {
  width: 108px;
  text-align: right;
}
.omnimux-assets-list-table th.omnimux-assets-th-updated {
  width: 104px;
  text-align: right;
}
.omnimux-assets-list-table th.omnimux-assets-th-actions {
  width: 148px;
  padding-right: 12px;
  text-align: right;
}
@container assets-list (max-width: 820px) {
  .omnimux-assets-th-desc,
  .omnimux-assets-td-desc {
    display: none;
  }
  .omnimux-assets-list-table th.omnimux-assets-th-name {
    width: auto;
  }
}
@container assets-list (max-width: 600px) {
  .omnimux-assets-th-updated,
  .omnimux-assets-td-updated {
    display: none;
  }
}
.omnimux-assets-th-sortable {
  cursor: pointer;
  transition: color 120ms ease;
}
.omnimux-assets-th-sortable:hover {
  color: var(--dsw-alias-label-primary);
}
.omnimux-assets-th-sort-inner {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.omnimux-assets-th-sort-icon {
  display: inline-flex;
  align-items: center;
  color: var(--dsw-alias-label-tertiary);
  opacity: 0.45;
  transition: opacity 120ms ease, color 120ms ease;
}
.omnimux-assets-th-sortable:hover .omnimux-assets-th-sort-icon {
  opacity: 0.85;
}
.omnimux-assets-th-sort-icon[data-active="true"] {
  opacity: 1;
  color: var(--dsw-alias-label-primary);
}

/* Rows */
.omnimux-assets-list-row {
  cursor: pointer;
  outline: none;
}
.omnimux-assets-list-row td {
  height: 52px;
  padding: 8px 10px;
  vertical-align: middle;
  border-bottom: 1px solid var(--dsw-alias-border-l1);
  transition: background-color 120ms ease;
}
.omnimux-assets-list-row td:first-child {
  padding: 8px 0 8px 10px;
  border-top-left-radius: 8px;
  border-bottom-left-radius: 8px;
}
.omnimux-assets-list-row td:last-child {
  padding-right: 12px;
  border-top-right-radius: 8px;
  border-bottom-right-radius: 8px;
}
.omnimux-assets-list-row:hover td,
.omnimux-assets-list-row[data-menu-open="true"] td {
  background-color: var(--dsw-alias-interactive-bg-hover);
  border-bottom-color: transparent;
}
.omnimux-assets-list-row[aria-selected="true"] td {
  background-color: var(--dsw-alias-interactive-bg-active);
  border-bottom-color: transparent;
}
.omnimux-assets-list-row:focus-visible td {
  background-color: var(--dsw-alias-interactive-bg-hover);
}
.omnimux-assets-list-row:focus-visible td:first-child {
  box-shadow: inset 2px 0 0 var(--dsw-alias-brand-primary);
}

/* Checkbox */
.omnimux-assets-td-check {
  width: 36px;
  text-align: center;
}
.omnimux-assets-checkbox {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1.5px solid var(--dsw-alias-border-l4);
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary-foreground);
  cursor: pointer;
  vertical-align: middle;
  opacity: 0.85;
  transition: background-color 120ms ease, border-color 120ms ease, opacity 120ms ease;
}
.omnimux-assets-th-check .omnimux-assets-checkbox,
.omnimux-assets-list-table[data-selecting="true"] .omnimux-assets-checkbox,
.omnimux-assets-list-row:hover .omnimux-assets-checkbox,
.omnimux-assets-list-row:focus-within .omnimux-assets-checkbox,
.omnimux-assets-checkbox[aria-checked="true"],
.omnimux-assets-checkbox[aria-checked="mixed"] {
  opacity: 1;
}
.omnimux-assets-checkbox:hover {
  border-color: var(--dsw-alias-label-secondary);
}
.omnimux-assets-checkbox[aria-checked="true"],
.omnimux-assets-checkbox[aria-checked="mixed"] {
  background: var(--dsw-alias-brand-primary);
  border-color: var(--dsw-alias-brand-primary);
}
.omnimux-assets-checkbox:focus-visible {
  outline: 2px solid var(--dsw-alias-brand-primary);
  outline-offset: 2px;
}
.omnimux-assets-checkbox-minus {
  width: 8px;
  height: 2px;
  border-radius: 1px;
  background: var(--dsw-alias-label-primary-foreground);
}

/* Name + 40x28 16:10 Micro Thumbnail */
.omnimux-assets-list-cell-name {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.omnimux-assets-list-thumb {
  flex: none;
  width: 40px;
  height: 28px;
  border-radius: 6px;
  background: var(--dsw-alias-bg-module-platform);
  border: 1px solid var(--dsw-alias-border-l1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--dsw-alias-label-tertiary);
}
.omnimux-assets-list-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.omnimux-assets-list-name-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  line-height: 20px;
  color: var(--dsw-alias-label-primary);
}

/* Type badge */
.omnimux-assets-list-badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  background: var(--dsw-alias-bg-module-platform);
  color: var(--dsw-alias-label-secondary);
  border: 1px solid var(--dsw-alias-border-l1);
  white-space: nowrap;
}

/* Description */
.omnimux-assets-td-desc {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  color: var(--dsw-alias-label-secondary);
}
.omnimux-assets-desc-muted {
  color: var(--dsw-alias-label-tertiary);
}

/* Files count + missing dot */
.omnimux-assets-td-files {
  text-align: right;
  font-size: 13px;
  color: var(--dsw-alias-label-secondary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.omnimux-assets-files-inner {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}
.omnimux-assets-list-missing {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  color: var(--dsw-alias-state-warn-label);
  background: var(--dsw-alias-state-warn-tertiary);
}
.omnimux-assets-list-missing-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--dsw-alias-state-warn-primary);
}

/* Updated Time */
.omnimux-assets-td-updated {
  text-align: right;
  font-size: 12px;
  color: var(--dsw-alias-label-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Hover-reveal Actions */
.omnimux-assets-td-actions {
  text-align: right;
  white-space: nowrap;
}
.omnimux-assets-list-actions {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}
.omnimux-assets-list-add-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  border: none;
  background: var(--dsw-alias-button-primary-fill);
  color: var(--dsw-alias-label-primary-foreground);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;

function cleanDescription(raw) {
  const text = String(raw || '')
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
  const human = lines.filter(line => !/^云端(?:分类|来源)[：:]/.test(line))
  if (human.length > 0) return { text: human.join(' '), muted: false }
  return { text: '—', muted: true }
}

    return (a.updatedMs - b.updatedMs) * dir
  })
}

        data-row-index="${idx}"
        aria-selected="${isSel ? 'true' : 'false'}"
        data-menu-open="${isMenuOpen ? 'true' : 'false'}"
        tabindex="${idx === 0 ? '0' : '-1'}"
        draggable="true"
      >
        <td class="omnimux-assets-td-check" data-stop="true">
          <span
            role="checkbox"
            tabindex="0"
            class="omnimux-assets-checkbox"
            aria-label="选择 ${escapeHtml(a.name)}"
            aria-checked="${isSel ? 'true' : 'false'}"
            data-check-id="${a.id}"
          >${isSel ? ICONS.check : ''}</span>
        </td>
        <td class="omnimux-assets-td-name">
          <div class="omnimux-assets-list-cell-name">
            <span class="omnimux-assets-list-thumb" data-thumb-id="${a.id}">${thumb}</span>
            <span class="omnimux-assets-list-name-text" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</span>
          </div>
        </td>
        <td class="omnimux-assets-td-type">
          <span class="omnimux-assets-list-badge">${TYPE_LABELS[a.type]}</span>
        </td>
        <td class="omnimux-assets-td-desc ${desc.muted ? 'omnimux-assets-desc-muted' : ''}" title="${escapeHtml(a.description)}">
          ${escapeHtml(desc.text)}
        </td>
        <td class="omnimux-assets-td-files">
          <span class="omnimux-assets-files-inner">
            <span>${a.files} 项</span>
            ${a.missing ? '<span class="omnimux-assets-list-missing"><span class="omnimux-assets-list-missing-dot"></span>缺失</span>' : ''}
          </span>
        </td>
        <td class="omnimux-assets-td-updated">${a.updatedText}</td>
        <td class="omnimux-assets-td-actions" data-stop="true">
          <div class="omnimux-assets-list-actions">
            <button
              type="button"
              class="omnimux-assets-list-add-btn"
              data-add-id="${a.id}"
              data-added="${isAdded ? 'true' : 'false'}"
              ${isAdded ? 'disabled' : ''}
            >${ICONS.chat}<span>${isAdded ? '已添加' : '添加到会话'}</span></button>
            <button
              type="button"
              class="omnimux-assets-list-more-btn"
              aria-label="更多操作"
              aria-haspopup="menu"
              aria-expanded="${isMenuOpen ? 'true' : 'false'}"
              data-more-id="${a.id}"
            >${ICONS.dots}</button>
          </div>
        </td>
      </tr>
    `
  }).join('')

  return `
    <div class="demo-stage-frame">
      <div class="stage-top"><h1 class="stage-title">资产中心</h1></div>
      <div class="stage-toolbar">
        <div class="stage-tabs"><span class="stage-tab active">本地</span><span class="stage-tab">公共</span><span class="stage-tab">产品库</span><span class="stage-tab">AI生成</span></div>
        <div class="demo-event-line" id="demoEventLine">${escapeHtml(state.lastEvent)}</div>
      </div>
      <div class="stage-chips">
        <button class="stage-chip active" type="button">全部</button>
        <button class="stage-chip" type="button">角色</button>
        <button class="stage-chip" type="button">场景</button>
        <button class="stage-chip" type="button">风格包</button>
        <button class="stage-chip" type="button">道具</button>
        <button class="stage-chip" type="button">知识包</button>
        <button class="stage-chip" type="button">自定义</button>
      </div>
      ${selectionBar}
      <div class="stage-main">
        <div class="omnimux-assets-list-wrap">
          <table class="omnimux-assets-list-table" data-selecting="${state.selected.size > 0 ? 'true' : 'false'}">
            <thead>
              <tr>
                <th class="omnimux-assets-th-check">
                  <span
                    role="checkbox"
                    tabindex="0"
                    id="selectAllCheckbox"
                    class="omnimux-assets-checkbox"
                    aria-label="全选资产"
                    aria-checked="${headerChecked}"
                  >${headerChecked === 'true' ? ICONS.check : (headerChecked === 'mixed' ? '<span class="omnimux-assets-checkbox-minus"></span>' : '')}</span>
                </th>
                <th class="omnimux-assets-th-name omnimux-assets-th-sortable" data-sort="name" aria-sort="${state.sortKey === 'name' ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}">
                  <span class="omnimux-assets-th-sort-inner"><span>名称</span>${sortArrow('name')}</span>
                </th>
                <th class="omnimux-assets-th-type omnimux-assets-th-sortable" data-sort="type" aria-sort="${state.sortKey === 'type' ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}">
                  <span class="omnimux-assets-th-sort-inner"><span>类型</span>${sortArrow('type')}</span>
                </th>
                <th class="omnimux-assets-th-desc">描述</th>
                <th class="omnimux-assets-th-files omnimux-assets-th-sortable" data-sort="files" aria-sort="${state.sortKey === 'files' ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}">
                  <span class="omnimux-assets-th-sort-inner"><span>素材</span>${sortArrow('files')}</span>
                </th>
                <th class="omnimux-assets-th-updated omnimux-assets-th-sortable" data-sort="updated_at" aria-sort="${state.sortKey === 'updated_at' ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}">
                  <span class="omnimux-assets-th-sort-inner"><span>更新时间</span>${sortArrow('updated_at')}</span>
                </th>
                <th class="omnimux-assets-th-actions">操作</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="demo-drop-zone" id="demoDropZone">
          <span>拖拽任意列表行到此处，模拟投放到会话输入框或画布工作区</span>
          <span id="demoDropPayload">等待拖拽</span>
        </div>
      </div>
    </div>
  `
}

function renderPortals() {
  document.querySelectorAll('.omnimux-assets-list-more-menu, .omnimux-assets-list-preview-popover').forEach(el => el.remove())

  if (state.menuAssetId && state.menuRect) {
    const asset = ASSETS.find(a => a.id === state.menuAssetId)
    if (asset) {
      const menu = document.createElement('div')
      menu.className = 'omnimux-assets-list-more-menu'
      menu.setAttribute('role', 'menu')
      const top = Math.min(window.innerHeight - 156, state.menuRect.bottom + 4)
      const left = Math.max(12, state.menuRect.right - 160)
      menu.style.top = `${top}px`
      menu.style.left = `${left}px`
      menu.innerHTML = `
        <button class="omnimux-assets-list-menu-item" data-act="detail" role="menuitem">${ICONS.eye}<span>查看详情</span></button>
        <button class="omnimux-assets-list-menu-item" data-act="reveal" role="menuitem">${ICONS.reveal}<span>打开文件位置</span></button>
        <button class="omnimux-assets-list-menu-item" data-act="copy" role="menuitem">${ICONS.copy}<span>复制引用</span></button>
        <div class="omnimux-assets-list-menu-sep" role="separator"></div>
        <button class="omnimux-assets-list-menu-item omnimux-assets-list-menu-item--danger" data-act="remove" role="menuitem">${ICONS.trash}<span>移除</span></button>
      `
      menu.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]')
        if (!btn) return
        const act = btn.getAttribute('data-act')
        state.lastEvent = `菜单操作：${act} -> ${asset.name}`
        state.menuAssetId = null
        state.menuRect = null
        render()
      })
      document.body.appendChild(menu)
    }
  }

  if (state.hoverPreview) {
    const { asset, rect } = state.hoverPreview
    const pop = document.createElement('div')
    pop.className = 'omnimux-assets-list-preview-popover'
    const left = Math.min(window.innerWidth - 368, rect.right + 12)
    const top = Math.max(12, Math.min(window.innerHeight - 380, rect.top - 24))
    pop.style.left = `${left}px`
    pop.style.top = `${top}px`
    pop.innerHTML = `
      <img class="omnimux-assets-list-preview-img" src="${asset.cover}" alt="" />
      <div class="omnimux-assets-list-preview-caption">
        <span class="omnimux-assets-list-preview-title">${escapeHtml(asset.name)}</span>
        <span>${TYPE_LABELS[asset.type]}</span>
      </div>
    `
    document.body.appendChild(pop)
  }
}

function bindAfterEvents() {
  const selectAll = document.getElementById('selectAllCheckbox')
  if (selectAll) {
    selectAll.addEventListener('click', () => {
      const list = sortedAssets()
      const all = list.every(a => state.selected.has(a.id))
      if (all) state.selected.clear()
      else list.forEach(a => state.selected.add(a.id))
      state.lastEvent = all ? '已取消全选' : `已全选 ${state.selected.size} 项`
      render()
    })
  }

  const clearBtn = document.getElementById('clearSelBtn')
  if (clearBtn) clearBtn.addEventListener('click', () => { state.selected.clear(); render() })
  const batchAddBtn = document.getElementById('batchAddBtn')
  if (batchAddBtn) batchAddBtn.addEventListener('click', () => {
    state.lastEvent = `已批量加入会话：${state.selected.size} 项`
    render()
  })

  document.querySelectorAll('[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-sort')
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc'
      } else {
        state.sortKey = key
        state.sortDir = (key === 'name' || key === 'type') ? 'asc' : 'desc'
      }
      state.lastEvent = `排序：${key} (${state.sortDir})`
      render()
    })
  })

  document.querySelectorAll('[data-check-id]').forEach(cb => {
    cb.addEventListener('click', (e) => {
      e.stopPropagation()
      const id = cb.getAttribute('data-check-id')
      const list = sortedAssets()
      if (e.shiftKey && state.lastSelectedId) {
        const i1 = list.findIndex(a => a.id === state.lastSelectedId)
        const i2 = list.findIndex(a => a.id === id)
        if (i1 !== -1 && i2 !== -1) {
          const [start, end] = i1 < i2 ? [i1, i2] : [i2, i1]
          for (let i = start; i <= end; i++) state.selected.add(list[i].id)
          state.lastEvent = `Shift 连选：已选 ${state.selected.size} 项`
          render()
          return
        }
      }
      if (state.selected.has(id)) state.selected.delete(id)
      else state.selected.add(id)
      state.lastSelectedId = id
      state.lastEvent = `已选 ${state.selected.size} 项`
      render()
    })
  })

  document.querySelectorAll('[data-add-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation()
      const id = btn.getAttribute('data-add-id')
      state.addedIds.add(id)
      const asset = ASSETS.find(a => a.id === id)
      state.lastEvent = `已添加到会话：${asset?.name || id}`
      render()
      setTimeout(() => { state.addedIds.delete(id); render() }, 1800)
    })
  })

  document.querySelectorAll('[data-more-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation()
      const id = btn.getAttribute('data-more-id')
      if (state.menuAssetId === id) {
        state.menuAssetId = null
        state.menuRect = null
      } else {
        state.menuAssetId = id
        state.menuRect = btn.getBoundingClientRect()
      }
      render()
    })
  })

  document.querySelectorAll('[data-thumb-id]').forEach(el => {
    const id = el.getAttribute('data-thumb-id')
    const asset = ASSETS.find(a => a.id === id)
    if (!asset?.cover) return
    el.addEventListener('mouseenter', () => {
      clearTimeout(hoverTimer)
      const rect = el.getBoundingClientRect()
      hoverTimer = setTimeout(() => {
        state.hoverPreview = { asset, rect }
        renderPortals()
      }, 200)
    })
    el.addEventListener('mouseleave', () => {
      clearTimeout(hoverTimer)
      if (state.hoverPreview) {
        state.hoverPreview = null
        renderPortals()
      }
    })
  })

  const rows = [...document.querySelectorAll('.omnimux-assets-list-row')]
  rows.forEach((row, idx) => {
    const id = row.getAttribute('data-asset-id')
    const asset = ASSETS.find(a => a.id === id)
    row.addEventListener('click', (e) => {
      if (e.target.closest('[data-stop="true"]')) return
      state.lastEvent = `点击整行打开预览/详情：${asset?.name || id}`
      render()
    })
    row.addEventListener('keydown', (e) => {
      if (e.target !== row) return
      if (e.key === 'ArrowDown' && idx < rows.length - 1) {
        e.preventDefault()
        rows[idx + 1].focus()
      } else if (e.key === 'ArrowUp' && idx > 0) {
        e.preventDefault()
        rows[idx - 1].focus()
      } else if (e.key === ' ') {
        e.preventDefault()
        state.lastEvent = `Space 快速预览：${asset?.name || id}`
        render()
      } else if (e.key === 'Enter') {
        e.preventDefault()
        state.lastEvent = `Enter 打开详情：${asset?.name || id}`
        render()
      }
    })
    row.addEventListener('dragstart', (e) => {
      const payload = { type: 'omnimux-asset', asset: { id: asset.id, name: asset.name, type: asset.type } }
      e.dataTransfer.setData('application/json', JSON.stringify(payload))
      e.dataTransfer.setData('text/plain', `@${asset.type}/${asset.name}`)
      e.dataTransfer.effectAllowed = 'copy'
    })
  })

  const dropZone = document.getElementById('demoDropZone')
  const dropPayload = document.getElementById('demoDropPayload')
  if (dropZone && dropPayload) {
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over') })
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('over') })
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault()
      dropZone.classList.remove('over')
      const cite = e.dataTransfer.getData('text/plain')
      dropPayload.textContent = `已接收：${cite}`
    })
  }
}

function render() {
  const mount = document.getElementById('mount')
  document.getElementById('demoShell').setAttribute('data-width', state.width)
  if (state.theme === 'dark') document.body.setAttribute('data-ds-dark-theme', '')
  else document.body.removeAttribute('data-ds-dark-theme')

  if (state.mode === 'before') {
    mount.innerHTML = renderBeforeSection()
  } else if (state.mode === 'after') {
    mount.innerHTML = renderAfterSection()
    bindAfterEvents()
  } else {
    mount.innerHTML = `<div class="compare-grid"><div><p class="compare-label">修改后（新版桌面列表）</p>${renderAfterSection()}</div><div><p class="compare-label">修改前（当前旧版表格）</p>${renderBeforeSection()}</div></div>`
    bindAfterEvents()
  }
  renderPortals()
}

document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.mode = btn.getAttribute('data-mode')
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b === btn))
    render()
  })
})
document.querySelectorAll('[data-theme]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.theme = btn.getAttribute('data-theme')
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b === btn))
    render()
  })
})
document.querySelectorAll('[data-width]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.width = btn.getAttribute('data-width')
    document.querySelectorAll('[data-width]').forEach(b => b.classList.toggle('active', b === btn))
    render()
  })
})
document.addEventListener('click', (e) => {
  if (state.menuAssetId && !e.target.closest('.omnimux-assets-list-more-menu') && !e.target.closest('[data-more-id]')) {
    state.menuAssetId = null
    state.menuRect = null
    render()
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (state.menuAssetId || state.hoverPreview)) {
    state.menuAssetId = null
    state.menuRect = null
    state.hoverPreview = null
    clearTimeout(hoverTimer)
    render()
  }
})

render()
</script>
</body>
</html>
