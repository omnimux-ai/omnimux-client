<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OmniMux 专家市场精兵演进（8 到 10）与底座裁剪演示</title>
<style>
  :root,
  :root[data-theme="dark"] {
    --dsw-alias-bg-base: #141517;
    --dsw-alias-bg-layer-1: #1a1c1f;
    --dsw-alias-bg-layer-2: #1e2023;
    --dsw-alias-bg-layer-3: #282b30;
    --dsw-alias-interactive-bg-hover: #25282e;
    --dsw-alias-border-l2: rgba(255, 255, 255, 0.08);
    --dsw-alias-border-subtle: rgba(255, 255, 255, 0.16);
    --dsw-alias-label-primary: #f5f6f8;
    --dsw-alias-label-primary-foreground: #111317;
    --dsw-alias-label-secondary: #9da1ab;
    --dsw-alias-label-tertiary: #7c8290;
    --dsw-alias-label-caption: #676d7a;
    --dsw-color-success: #10b981;
    --dsw-color-info: #60a5fa;
    --dsw-color-danger: #f87171;
    --dsw-color-danger-bg: rgba(248, 113, 113, 0.12);
    --dsw-color-danger-border: rgba(248, 113, 113, 0.34);
    --dsw-alias-shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.42);
  }

  :root[data-theme="light"] {
    --dsw-alias-bg-base: #f5f6f8;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-alias-bg-layer-3: #eceff3;
    --dsw-alias-interactive-bg-hover: #f2f4f7;
    --dsw-alias-border-l2: rgba(17, 24, 39, 0.09);
    --dsw-alias-border-subtle: rgba(17, 24, 39, 0.18);
    --dsw-alias-label-primary: #111827;
    --dsw-alias-label-primary-foreground: #ffffff;
    --dsw-alias-label-secondary: #4b5563;
    --dsw-alias-label-tertiary: #6b7280;
    --dsw-alias-label-caption: #9ca3af;
    --dsw-color-success: #059669;
    --dsw-color-info: #2563eb;
    --dsw-color-danger: #dc2626;
    --dsw-color-danger-bg: rgba(220, 38, 38, 0.08);
    --dsw-color-danger-border: rgba(220, 38, 38, 0.28);
    --dsw-alias-shadow-overlay: 0 12px 28px rgba(15, 23, 42, 0.12);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .demo-bar {
    position: relative;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 24px;
    background: var(--dsw-alias-bg-layer-1);
    border-bottom: 1px solid var(--dsw-alias-border-l2);
  }
  .demo-brand { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
  .demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seg {
    display: inline-flex;
    padding: 3px;
    border-radius: 10px;
    background: var(--dsw-alias-bg-layer-3);
    border: 1px solid var(--dsw-alias-border-l2);
    gap: 2px;
  }
  .seg button, .ctrl-btn {
    border: none;
    background: transparent;
    color: var(--dsw-alias-label-secondary);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .seg button.active {
    background: var(--dsw-alias-label-primary);
    color: var(--dsw-alias-label-primary-foreground);
    font-weight: 600;
  }
  .ctrl-btn {
    border: 1px solid var(--dsw-alias-border-l2);
    background: var(--dsw-alias-bg-layer-2);
    color: var(--dsw-alias-label-primary);
  }
  .ctrl-btn:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .ctrl-btn.warn {
    color: var(--dsw-color-danger);
    border-color: var(--dsw-color-danger-border);
    background: var(--dsw-color-danger-bg);
  }

  .viewport-shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .viewport-shell.narrow {
    max-width: 520px;
    border-left: 1px dashed var(--dsw-alias-border-subtle);
    border-right: 1px dashed var(--dsw-alias-border-subtle);
    min-height: calc(100vh - 56px);
  }

  .workshop-intro { margin-bottom: 20px; }
  .workshop-title { font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .workshop-subtitle { font-size: 14px; color: var(--dsw-alias-label-secondary); margin: 0 0 14px; }
  .btn-create {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: var(--dsw-alias-label-primary);
    color: var(--dsw-alias-label-primary-foreground);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .nav-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--dsw-alias-border-l2);
    margin-bottom: 16px;
  }
  .nav-tabs { display: flex; gap: 20px; }
  .nav-tab {
    font-size: 14px;
    color: var(--dsw-alias-label-secondary);
    padding: 6px 0;
    position: relative;
    cursor: default;
  }
  .nav-tab.active { color: var(--dsw-alias-label-primary); font-weight: 600; }
  .nav-tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -13px;
    height: 2px;
    background: var(--dsw-alias-label-primary);
  }
  .search-input {
    width: 240px;
    max-width: 100%;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--dsw-alias-border-l2);
    background: var(--dsw-alias-bg-layer-2);
    color: var(--dsw-alias-label-primary);
    font-size: 13px;
    outline: none;
  }
  .search-input:focus { border-color: var(--dsw-alias-border-subtle); }

  .expert-stage-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .cat-btn {
    border: 1px solid var(--dsw-alias-border-l2);
    background: var(--dsw-alias-bg-layer-2);
    color: var(--dsw-alias-label-secondary);
    border-radius: 9999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }
  .cat-btn:hover { color: var(--dsw-alias-label-primary); border-color: var(--dsw-alias-border-subtle); }
  .cat-btn.active {
    background: var(--dsw-alias-label-primary);
    color: var(--dsw-alias-label-primary-foreground);
    border-color: var(--dsw-alias-label-primary);
    font-weight: 600;
  }

  .expert-error-toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 420px;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--dsw-alias-bg-layer-1);
    border: 1px solid var(--dsw-color-danger-border);
    box-shadow: var(--dsw-alias-shadow-overlay);
    font-size: 13px;
    color: var(--dsw-alias-label-primary);
  }
  .expert-error-toast .err-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--dsw-color-danger); flex-shrink: 0;
  }
  .expert-error-toast button {
    border: none; background: transparent; color: var(--dsw-alias-label-secondary); cursor: pointer; font-size: 14px;
  }

  .expert-market-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
  }
  .viewport-shell.narrow .expert-market-grid {
    grid-template-columns: 1fr;
  }
  @media (max-width: 1180px) { .expert-market-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .expert-market-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .expert-market-grid { grid-template-columns: 1fr; } }

  .expert-card {
    background: var(--dsw-alias-bg-layer-2);
    border: 1px solid var(--dsw-alias-border-l2);
    border-radius: 20px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    position: relative;
    min-height: 296px;
    transition: border-color .18s ease, background .18s ease;
  }
  .expert-card:hover {
    background: var(--dsw-alias-interactive-bg-hover);
    border-color: var(--dsw-alias-border-subtle);
  }
  .expert-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .expert-card-avatar-wrap {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--dsw-alias-bg-layer-3);
    flex-shrink: 0;
  }
  .expert-card-avatar { width: 100%; height: 100%; display: block; }
  .expert-pill-btn {
    background: var(--dsw-alias-label-primary);
    color: var(--dsw-alias-label-primary-foreground);
    border: none;
    border-radius: 9999px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    line-height: 1.2;
    transition: opacity .15s;
  }
  .expert-pill-btn.secondary {
    background: var(--dsw-alias-bg-layer-3);
    color: var(--dsw-alias-label-primary);
    border: 1px solid var(--dsw-alias-border-l2);
  }
  .expert-pill-btn:hover { opacity: 0.9; }
  .expert-card-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .expert-card-status { font-size: 12px; font-weight: 600; letter-spacing: 0.4px; }
  .expert-card-status.enabled { color: var(--dsw-color-success); }
  .expert-card-status.system { color: var(--dsw-color-info); }
  .expert-card-status.available, .expert-card-status.disabled { color: var(--dsw-alias-label-tertiary); }
  .expert-card-stage {
    font-size: 11px;
    color: var(--dsw-alias-label-secondary);
    background: var(--dsw-alias-bg-layer-3);
    padding: 2px 8px;
    border-radius: 9999px;
    white-space: nowrap;
  }
  .expert-card-title { font-size: 16px; font-weight: 700; margin: 0 0 8px; line-height: 1.35; }
  .expert-card-desc { font-size: 13px; line-height: 1.55; color: var(--dsw-alias-label-secondary); margin: 0; flex: 1; }

  /* Live Composer & Tool Scope Preview */
  .live-sync-panel {
    margin-top: 28px;
    padding: 20px;
    border-radius: 16px;
    background: var(--dsw-alias-bg-layer-1);
    border: 1px solid var(--dsw-alias-border-l2);
  }
  .live-sync-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
  }
  .live-sync-title { font-size: 13px; font-weight: 600; }
  .live-sync-sub { font-size: 12px; color: var(--dsw-alias-label-secondary); }
  .picker-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .picker-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid var(--dsw-alias-border-l2);
    background: var(--dsw-alias-bg-layer-2);
    color: var(--dsw-alias-label-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .picker-chip:hover { border-color: var(--dsw-alias-border-subtle); background: var(--dsw-alias-interactive-bg-hover); }
  .picker-chip.active {
    border-color: var(--dsw-alias-label-primary);
    background: var(--dsw-alias-bg-layer-3);
    font-weight: 600;
  }
  .picker-chip img { width: 20px; height: 20px; border-radius: 50%; }
  .picker-chip .badge-def { font-size: 11px; color: var(--dsw-alias-label-tertiary); }

  /* Blank-session Composer Preview */
  .composer-preview-wrap {
    max-width: 680px;
    margin: 0 auto;
  }
  .composer-card {
    border-radius: 16px;
    border: 1px solid var(--dsw-alias-border-subtle);
    background: var(--dsw-alias-bg-layer-2);
    padding: 14px 16px;
  }
  .composer-textarea {
    width: 100%;
    min-height: 68px;
    border: 0;
    resize: vertical;
    outline: none;
    background: transparent;
    color: var(--dsw-alias-label-primary);
    font: inherit;
    font-size: 14px;
    line-height: 1.55;
  }
  .composer-textarea::placeholder { color: var(--dsw-alias-label-tertiary); }
  .composer-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--dsw-alias-border-l2);
    gap: 8px;
  }
  .composer-seat {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--dsw-alias-label-secondary);
  }
  .composer-seat img { width: 18px; height: 18px; border-radius: 50%; }
  .composer-scope-badge {
    font-size: 11px;
    color: var(--dsw-alias-label-secondary);
    background: var(--dsw-alias-bg-layer-3);
    padding: 3px 8px;
    border-radius: 9999px;
  }

  /* Mirrors production .omx-quick-shortcuts exactly (borderless centered links) */
  .omx-quick-shortcuts {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 24px;
    margin-top: 12px;
  }
  .omx-quick-shortcut-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--dsw-alias-label-secondary);
    font: inherit;
    font-size: 13px;
    line-height: 18px;
    white-space: nowrap;
    cursor: pointer;
    transition: color .15s ease;
  }
  .omx-quick-shortcut-btn:hover,
  .omx-quick-shortcut-btn.is-active { color: var(--dsw-alias-label-primary); }
  .omx-quick-shortcut-btn.is-active { font-weight: 600; }
  .omx-quick-shortcut-arrow { opacity: 0.55; font-size: 12px; }
  .omx-quick-shortcut-btn:hover .omx-quick-shortcut-arrow,
  .omx-quick-shortcut-btn.is-active .omx-quick-shortcut-arrow { opacity: 1; }
  .empty-dock-hint {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    color: var(--dsw-alias-label-tertiary);
  }
  .tool-scope-summary {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--dsw-alias-bg-layer-3);
    font-size: 12px;
    color: var(--dsw-alias-label-secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }
  .tool-scope-summary strong { color: var(--dsw-alias-label-primary); font-weight: 600; }
</style>
</head>
<body>
  <div class="demo-bar">
    <div class="demo-brand">
      <span>OmniMux 专家市场精兵演进演示</span>
      <div class="seg" role="group" aria-label="Before or After">
        <button id="btnAfter" class="active" type="button">改造后（10 专家 + 工具裁剪 + 首启引导）</button>
        <button id="btnBefore" type="button">改造前（8 专家 + 裸输入框）</button>
      </div>
    </div>
    <div class="demo-controls">
      <div class="seg" role="group" aria-label="Theme">
        <button id="btnDark" class="active" type="button">暗色</button>
        <button id="btnLight" type="button">亮色</button>
      </div>
      <div class="seg" role="group" aria-label="Locale">
        <button id="btnZh" class="active" type="button">中文</button>
        <button id="btnEn" type="button">EN</button>
      </div>
      <div class="seg" role="group" aria-label="Viewport">
        <button id="btnWide" class="active" type="button">宽屏</button>
        <button id="btnNarrow" type="button">窄屏 520px</button>
      </div>
      <button id="btnFail" class="ctrl-btn warn" type="button">模拟挂载失败</button>
    </div>
  </div>

  <main id="shell" class="viewport-shell">
    <section class="workshop-intro">
      <h1 id="introTitle" class="workshop-title">专家市场</h1>
      <p id="introSub" class="workshop-subtitle">按需聘用跨境电商 SOP 专家，即装即进会话预设选择器</p>
      <button id="btnCreate" class="btn-create" type="button">创建专家</button>
    </section>

    <div class="nav-bar">
      <div class="nav-tabs">
        <span class="nav-tab">Skill</span>
        <span class="nav-tab">我的 Skill</span>
        <span class="nav-tab active" id="tabExperts">专家市场</span>
        <span class="nav-tab">插件专栏</span>
      </div>
      <input id="searchInput" class="search-input" type="search" placeholder="搜索全部专家..." />
    </div>

    <div id="stageBar" class="expert-stage-bar"></div>
    <div id="grid" class="expert-market-grid"></div>

    <section class="live-sync-panel" aria-live="polite">
      <div class="live-sync-head">
        <span class="live-sync-title" id="pickerTitle">新对话预设切换与空白会话引导预览</span>
        <span class="live-sync-sub" id="pickerMeta"></span>
      </div>
      <div id="pickerList" class="picker-list"></div>

      <div class="composer-preview-wrap">
        <div class="composer-card">
          <textarea id="composerInput" class="composer-textarea" placeholder="输入你的内容电商需求，或点下方起手式填入模板..."></textarea>
          <div class="composer-footer">
            <span id="composerSeat" class="composer-seat"></span>
            <span id="composerScopeBadge" class="composer-scope-badge"></span>
          </div>
        </div>
        <div id="dockBar" class="omx-quick-shortcuts"></div>
        <div id="dockHint" class="empty-dock-hint" style="display:none;"></div>
        <div id="toolScopeBox" class="tool-scope-summary"></div>
      </div>
    </section>
  </main>

  <div id="errorToast" class="expert-error-toast" style="display:none;" role="alert">
    <span class="err-dot"></span>
    <span id="errorText"></span>
    <button id="errorClose" type="button" aria-label="关闭">✕</button>
  </div>

<script>
  function hashSeed(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }
  function pixelAvatar(id) {
    const h = hashSeed(id);
    const bg = ['#e0f2fe','#fce7f3','#dcfce7','#fef3c7','#ede9fe','#ffedd5','#cffafe','#f3e8ff'][h % 8];
    const skin = ['#f6d5b8','#e8b892','#d19a6e','#f2c9a0'][(h >>> 3) % 4];
    const hair = ['#1f2937','#7c2d12','#312e81','#065f46','#9a3412','#4c1d95'][(h >>> 6) % 6];
    const shirt = ['#2563eb','#059669','#7c3aed','#ea580c','#db2777','#0891b2','#4f46e5','#ca8a04'][(h >>> 9) % 8];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">`
      + `<rect width="16" height="16" fill="${bg}"/>`
      + `<rect x="4" y="2" width="8" height="3" fill="${hair}"/>`
      + `<rect x="4" y="5" width="8" height="6" fill="${skin}"/>`
      + `<rect x="5" y="7" width="2" height="1" fill="#111827"/><rect x="9" y="7" width="2" height="1" fill="#111827"/>`
      + `<rect x="6" y="9" width="4" height="1" fill="#7c2d12"/>`
      + `<rect x="3" y="12" width="10" height="4" fill="${shirt}"/>`
      + `</svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  const SYSTEM_PRESETS = [
    { id: 'omni-agent', name: 'OmniMux', nameEn: 'OmniMux', stage: 'system', desc: '内容电商全链路默认 Agent，覆盖选品洞察、脚本分镜、素材生产与全域增长。', descEn: 'All-in-one content e-commerce default Agent from research to production and growth.', status: 'system', domains: ['全部 15 个受管域'] },
    { id: 'cordis', name: '创建Agent', nameEn: 'Create Agent', stage: 'system', desc: 'DSH 原生创造模式：插件实验开发、运行时检查与自定义 Agent 搭建。', descEn: 'DSH native Creator Mode for plugin development, runtime inspection, and custom Agents.', status: 'system', domains: ['DSH 原生创造模式'] },
  ];

  const ALL_EXPERTS = [
    {

        <div class="expert-card-meta-row">
          <div class="expert-card-status ${it.status}">${statusMap[it.status]}</div>
          ${stageBadge}
        </div>
        <div class="expert-card-title">${isEn ? it.nameEn : it.name}</div>
        <p class="expert-card-desc">${descText}</p>
      `;
      const btn = card.querySelector('.expert-pill-btn');
      if (btn) {
        btn.onclick = () => {
          hideError();
          if (!isEnabled && failNextInstall) {
            failNextInstall = false;
            showError(isEn
              ? `Mount failed for ${it.nameEn}: rolled back cleanly so status stays Hireable.`
              : `「${it.name}」挂载校验失败（broken），已自动回滚并保持可聘用状态。`);
            return;
          }
          expertStates[it.id] = isEnabled ? 'disabled' : 'enabled';
          if (expertStates[it.id] === 'enabled') activePresetId = it.id;
          else if (activePresetId === it.id) activePresetId = 'omni-agent';
          activeStarterId = null;
          render();
        };
      }
      grid.appendChild(card);
    }

    const registered = [...SYSTEM_PRESETS, ...pool.filter((e) => expertStates[e.id] === 'enabled')];
    if (!registered.some((p) => p.id === activePresetId)) activePresetId = 'omni-agent';

    document.getElementById('pickerMeta').textContent = isEn
      ? `Active session presets: ${registered.length} (click to preview blank-session dock & tool scope)`
      : `当前会话下拉共 ${registered.length} 项（点击切换预览空白会话引导与工具裁剪）`;

    const pickerList = document.getElementById('pickerList');
    pickerList.innerHTML = '';
    for (const p of registered) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'picker-chip' + (p.id === activePresetId ? ' active' : '');
      chip.innerHTML = `<img src="${pixelAvatar(p.id)}" alt=""/><span>${isEn ? p.nameEn : p.name}</span>${p.id === 'omni-agent' ? `<span class="badge-def">${isEn ? 'Default' : '默认'}</span>` : ''}`;
      chip.onclick = () => {
        activePresetId = p.id;
        activeStarterId = null;
        document.getElementById('composerInput').value = '';
        render();
      };
      pickerList.appendChild(chip);
    }

    const activePreset = registered.find((p) => p.id === activePresetId) || SYSTEM_PRESETS[0];
    document.getElementById('composerSeat').innerHTML = `<img src="${pixelAvatar(activePreset.id)}" alt=""/><span>${isEn ? activePreset.nameEn : activePreset.name}</span>`;

    const dockBar = document.getElementById('dockBar');
    const dockHint = document.getElementById('dockHint');
    const scopeBadge = document.getElementById('composerScopeBadge');
    const scopeBox = document.getElementById('toolScopeBox');
    dockBar.innerHTML = '';
    dockHint.style.display = 'none';

    if (activePreset.id === 'omni-agent') {
      scopeBadge.textContent = isEn ? 'All 15 managed domains' : '全量 15 个受管工具域';
      scopeBox.innerHTML = isEn
        ? '<strong>Tool Scope:</strong> Default OmniMux keeps all Host domains visible. Dock shows 4 standard commerce shortcuts.'
        : '<strong>工具裁剪：</strong>默认 OmniMux 保留全量宿主工具域，下方展示 4 条内容电商快捷方式。';
      for (const sc of OMNI_SHORTCUTS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'omx-quick-shortcut-btn' + (activeStarterId === sc.id ? ' is-active' : '');
        b.innerHTML = `<span>${isEn ? sc.labelEn : sc.labelZh}</span><span class="omx-quick-shortcut-arrow">↗</span>`;
        b.onclick = () => {
          activeStarterId = activeStarterId === sc.id ? null : sc.id;
          document.getElementById('composerInput').value = activeStarterId ? sc.promptZh : '';
          render();
        };
        dockBar.appendChild(b);
      }
    } else if (activePreset.id === 'cordis') {
      scopeBadge.textContent = isEn ? 'Creator Mode' : 'DSH 原生创造模式';
      scopeBox.innerHTML = isEn
        ? '<strong>Dock Mutual Exclusion:</strong> Creator Mode renders zero shortcut / bootstrap DOM.'
        : '<strong>互斥门控：</strong>创造模式下输入框下方严格保持 0 DOM，不挂载任何电商引导条。';
      dockHint.style.display = 'block';
      dockHint.textContent = isEn ? '(Zero DOM below composer in Creator Mode)' : '（创造模式下此处为 0 DOM）';
    } else if (mode === 'before') {
      scopeBadge.textContent = isEn ? 'Unrestricted (100+ tools)' : '未裁剪（暴露全量 100+ 工具）';
      scopeBox.innerHTML = isEn
        ? '<strong>Before:</strong> All hired experts receive every global Host tool and a bare blank-session composer.'
        : '<strong>改造前痛点：</strong>所有聘用专家挂载同一份 100+ 全局工具，且空白会话无任何起手式引导。';
      dockHint.style.display = 'block';
      dockHint.textContent = isEn ? '(Bare composer before ExpertBootstrapBar)' : '（改造前此处为空白无引导）';
    } else {
      scopeBadge.textContent = isEn
        ? `${activePreset.domains.length} domains allowed (${activePreset.hiddenCount} hidden)`
        : `仅放行 ${activePreset.domains.length} 域（裁剪 ${activePreset.hiddenCount} 个无关工具）`;
      scopeBox.innerHTML = isEn
        ? `<span><strong>Allowed Host Domains:</strong> ${activePreset.domains.join(', ')}</span><span><strong>External MCP:</strong> Passed through</span>`
        : `<span><strong>放行宿主域：</strong>${activePreset.domains.join(', ')}</span><span><strong>第三方自装 MCP：</strong>默认透传不误杀</span>`;
      for (const st of activePreset.starters || []) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'omx-quick-shortcut-btn' + (activeStarterId === st.id ? ' is-active' : '');
        b.innerHTML = `<span>${isEn ? st.labelEn : st.labelZh}</span><span class="omx-quick-shortcut-arrow">↗</span>`;
        b.onclick = () => {
          activeStarterId = activeStarterId === st.id ? null : st.id;
          document.getElementById('composerInput').value = activeStarterId ? (isEn ? st.promptEn : st.promptZh) : '';
          render();
        };
        dockBar.appendChild(b);
      }
    }
  }

  document.getElementById('btnAfter').onclick = (e) => { mode = 'after'; e.target.classList.add('active'); document.getElementById('btnBefore').classList.remove('active'); render(); };
  document.getElementById('btnBefore').onclick = (e) => { mode = 'before'; e.target.classList.add('active'); document.getElementById('btnAfter').classList.remove('active'); render(); };
  document.getElementById('btnDark').onclick = (e) => { document.documentElement.setAttribute('data-theme', 'dark'); e.target.classList.add('active'); document.getElementById('btnLight').classList.remove('active'); };
  document.getElementById('btnLight').onclick = (e) => { document.documentElement.setAttribute('data-theme', 'light'); e.target.classList.add('active'); document.getElementById('btnDark').classList.remove('active'); };
  document.getElementById('btnZh').onclick = (e) => { lang = 'zh'; e.target.classList.add('active'); document.getElementById('btnEn').classList.remove('active'); render(); };
  document.getElementById('btnEn').onclick = (e) => { lang = 'en'; e.target.classList.add('active'); document.getElementById('btnZh').classList.remove('active'); render(); };
  document.getElementById('btnWide').onclick = (e) => { document.getElementById('shell').classList.remove('narrow'); e.target.classList.add('active'); document.getElementById('btnNarrow').classList.remove('active'); };
  document.getElementById('btnNarrow').onclick = (e) => { document.getElementById('shell').classList.add('narrow'); e.target.classList.add('active'); document.getElementById('btnWide').classList.remove('active'); };
  document.getElementById('btnFail').onclick = () => { failNextInstall = true; showError(lang === 'en' ? 'Next install click will simulate a mount failure & rollback.' : '下次点击任意专家「安装」将模拟挂载失败并回滚状态。'); };
  document.getElementById('errorClose').onclick = hideError;
  document.getElementById('searchInput').oninput = (e) => { query = e.target.value; render(); };

  render();
</script>
</body>
</html>
