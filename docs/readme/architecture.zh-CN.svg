<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none" role="img" aria-label="OmniMux 客户端系统分层架构图">
  <defs>
    <linearGradient id="bg-card-zh" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFC"/>
      <stop offset="100%" stop-color="#F3F4F8"/>
    </linearGradient>
    <linearGradient id="desktop-bar-zh" x1="36" y1="28" x2="924" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="hub-bar-zh" x1="36" y1="306" x2="924" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF0FF"/>
      <stop offset="100%" stop-color="#E4E6FF"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1" y="1" width="958" height="538" rx="18" fill="url(#bg-card-zh)" stroke="#E2E5EE" stroke-width="2"/>

  <!-- Layer 1: Desktop Shell -->
  <rect x="36" y="28" width="888" height="72" rx="12" fill="url(#desktop-bar-zh)"/>
  <text x="60" y="58" fill="#FFFFFF" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-size="18" font-weight="700">OmniMux 桌面客户端（Electron）</text>
  <rect x="748" y="42" width="152" height="24" rx="12" fill="#B8B7FF"/>
  <text x="824" y="58" text-anchor="middle" fill="#121213" font-family="'PingFang SC', -apple-system, sans-serif" font-size="11.5" font-weight="700">macOS &amp; Windows</text>
  <text x="60" y="82" fill="#CBD5E1" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5">原生窗口  ·  系统托盘  ·  首次配置向导  ·  本地运行时托管  ·  手机远程协同（Agents Anywhere）</text>

  <!-- Connector 1 -> 2 -->
  <line x1="480" y1="100" x2="480" y2="128" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="474,122 486,122 480,130" fill="#94A3B8"/>
  <rect x="356" y="104" width="248" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="118" text-anchor="middle" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600">本地运行时 &amp; Cordis 插件组合层</text>

  <!-- Layer 2: Dual-Surface Workbench -->
  <rect x="36" y="132" width="888" height="142" rx="12" fill="#FFFFFF" stroke="#D8DCE8" stroke-width="1.5"/>
  <text x="58" y="158" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700">人机双面工作台</text>
  <text x="184" y="158" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">人类交互界面（UI Surface）与 Agent 工具面共享同一领域存储与服务层</text>

  <!-- Row 1 -->
  <rect x="56" y="172" width="202" height="40" rx="8" fill="#F8F9FC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="190" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">产品库 Products</text>
  <text x="70" y="205" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">链接解析 · 卖点建档 · @产品引用</text>

  <rect x="270" y="172" width="202" height="40" rx="8" fill="#F8F9FC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="284" y="190" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">资产库 Assets</text>
  <text x="284" y="205" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">角色 · 场景 · 风格包 · 道具</text>

  <rect x="484" y="172" width="202" height="40" rx="8" fill="#F8F9FC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="498" y="190" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">灵感库 Inspiration</text>
  <text x="498" y="205" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">按对象拆解 · 本地合集 · 一键复刻</text>

  <rect x="698" y="172" width="206" height="40" rx="8" fill="#F8F9FC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="712" y="190" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">无限画布 Workflow</text>
  <text x="712" y="205" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">DAG 节点编排 · 并行与断点恢复</text>

  <!-- Row 2 -->
  <rect x="56" y="222" width="202" height="40" rx="8" fill="#F8F9FC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="70" y="240" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">剪辑工坊 Clip</text>
  <text x="70" y="255" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">多轨时间轴 · WebCodecs 导出</text>

  <rect x="270" y="222" width="202" height="40" rx="8" fill="#F8F9FC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="284" y="240" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">浏览器伴侣 Browser</text>
  <text x="284" y="255" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">Chrome 扩展 · 悬停素材采集</text>

  <rect x="484" y="222" width="202" height="40" rx="8" fill="#F8F9FC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="498" y="240" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">技能市场 Market</text>
  <text x="498" y="255" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">120+ 技能 · 100+ 专家 · 连接器</text>

  <rect x="698" y="222" width="206" height="40" rx="8" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="712" y="240" fill="#581C87" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">发布与复盘（Beta）</text>
  <text x="712" y="255" fill="#7E22CE" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5">海外账号 · 排期分发 · 数据看板</text>

  <!-- Connector 2 -> 3 -->
  <line x1="480" y1="274" x2="480" y2="304" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="474,298 486,298 480,306" fill="#94A3B8"/>
  <rect x="380" y="279" width="200" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="293" text-anchor="middle" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600">统一 Seam 接口 &amp; 事件总线</text>

  <!-- Layer 3: Execution Hub -->
  <rect x="36" y="308" width="888" height="72" rx="12" fill="url(#hub-bar-zh)" stroke="#B8B7FF" stroke-width="1.5"/>
  <text x="60" y="337" fill="#1E1B4B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">OmniMux 执行中枢（Execution Hub）</text>
  <rect x="756" y="320" width="144" height="24" rx="12" fill="#1E1B4B"/>
  <text x="828" y="336" text-anchor="middle" fill="#FFFFFF" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">密钥不进工程文件</text>
  <text x="60" y="362" fill="#3730A3" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5">统一身份认证  ·  本地凭据存储  ·  多模态模型目录与路由  ·  长任务轮询与断点恢复  ·  参数契约校验</text>

  <!-- Connectors 3 -> 4 -->
  <line x1="254" y1="380" x2="254" y2="410" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="248,404 260,404 254,412" fill="#94A3B8"/>
  <line x1="706" y1="380" x2="706" y2="410" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="700,404 712,404 706,412" fill="#94A3B8"/>

  <!-- Layer 4 Left -->
  <rect x="36" y="414" width="434" height="98" rx="12" fill="#FFFFFF" stroke="#D8DCE8" stroke-width="1.5"/>
  <text x="58" y="442" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">多模态模型通道</text>
  <text x="58" y="464" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">OmniMux 官方通道  +  BYOK 自定义端点</text>
  <rect x="58" y="476" width="66" height="22" rx="6" fill="#EEF2FF"/>
  <text x="91" y="491" text-anchor="middle" fill="#3730A3" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600">文本</text>
  <rect x="132" y="476" width="68" height="22" rx="6" fill="#EEF2FF"/>
  <text x="166" y="491" text-anchor="middle" fill="#3730A3" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600">图像</text>
  <rect x="208" y="476" width="68" height="22" rx="6" fill="#EEF2FF"/>
  <text x="242" y="491" text-anchor="middle" fill="#3730A3" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600">视频</text>
  <rect x="284" y="476" width="68" height="22" rx="6" fill="#EEF2FF"/>
  <text x="318" y="491" text-anchor="middle" fill="#3730A3" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600">音乐</text>
  <rect x="360" y="476" width="88" height="22" rx="6" fill="#EEF2FF"/>
  <text x="404" y="491" text-anchor="middle" fill="#3730A3" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600">语音 / ASR</text>

  <!-- Layer 4 Right -->
  <rect x="490" y="414" width="434" height="98" rx="12" fill="#FFFFFF" stroke="#D8DCE8" stroke-width="1.5"/>
  <text x="512" y="442" fill="#121213" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">本地优先工作区存储</text>
  <text x="512" y="464" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">业务数据默认保存在本机 $DSH_HOME 目录</text>
  <text x="512" y="490" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">products · assets · inspirations · workflow · clip</text>
</svg>
