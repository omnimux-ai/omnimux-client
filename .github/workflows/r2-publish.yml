name: Publish release assets to R2 (dl.omnimux.ai)

# Promotes an already-built GitHub Release to the Cloudflare R2 distribution
# bucket behind https://dl.omnimux.ai, then purges the CDN edge cache and
# verifies the live endpoints.
#
# This is the "re-publish / CDN sync only" path: it never rebuilds the desktop.
# It downloads the installers attached to an existing `v<version>` GitHub Release
# (arm64/x64 DMGs and the Windows x64 NSIS installer), regenerates
# `api/desktop/version-stable.json` from those exact bytes, uploads everything
# under `releases/v<version>/` plus the `releases/latest/*` aliases, purges the
# CDN cache for those aliases, and finally verifies the live download URLs.
#
# The CDN channel only moves forward: `verify-version-advance.mjs` runs before
# any download/upload and rejects a version that is equal to or older than the
# live `version-<channel>.json`. A rollback therefore means a forward-fix with a
# higher version, never re-pointing latest at an older build.
#
# `mode=publish` always requires all three platform hashes and is the only mode
# that writes `version-<channel>.json` and updates `releases/latest/*`.
# `mode=partial` only uploads the versioned archive under `releases/v<version>/`;
# it never touches latest aliases or channel manifests.
#
# Unlike the historical nested workflow that Actions never read, and which
# pulled artifacts from a private fork, this workflow runs from the repository
# root and sources artifacts from this repository's own public GitHub Release.
on:
  pull_request:
    paths:
      - '.github/workflows/r2-publish.yml'
      - '.github/actions/generate-market-index/**'
      - 'app/scripts/build-plugin-index.mjs'
      - 'app/scripts/verify-plugin-index.mjs'
      - 'app/scripts/verify-plugin-index.test.mjs'
      - 'app/scripts/plugin-tiers.mjs'
      - 'app/scripts/build-release-metadata.mjs'
      - 'app/scripts/build-release-metadata.test.mjs'
      - 'app/scripts/sign-release-manifest.mjs'
      - 'app/scripts/sign-release-manifest.test.mjs'
      - 'app/scripts/cf-purge-cache.mjs'
      - 'app/scripts/r2-dist-sync.mjs'
      - 'app/scripts/r2-dist-sync.test.mjs'
      - 'app/scripts/verify-version-advance.mjs'
      - 'app/scripts/verify-version-advance.test.mjs'
      - 'dsh-version.json'
      - 'app/config/plugin-tiers.json'
      - 'app/*.json'
      - 'app/dsh-desktop-next/package.json'
      - 'app/yarn.lock'
      - 'app/.yarnrc.yml'
      - 'plugins/plugins/*/package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 2.0.23, leading "v" optional)'
        required: true
        type: string
      mode:
        description: 'publish: full three-platform latest promotion; partial: upload releases/v<version>/ only (never latest or version-*.json)'
        required: true
        type: choice
        options: [publish, partial]
        default: publish
      required_platforms:
        description: 'Platforms expected for a publish (must be exactly mac-arm64,mac-x64,windows); ignored in partial mode'
        required: false
        type: string
        default: 'mac-arm64,mac-x64,windows'
      min_supported_version:
        description: 'Optional minimum supported client version for Manifest v2 mandatory update floor (e.g. 2.0.20)'
        required: false
        type: string
        default: ''
      urgency:
        description: 'Manifest v2 update urgency'
        required: false
        type: choice
        options: [normal, critical]
        default: normal
      rollout_percentage:
        description: 'Manifest v2 deterministic rollout percentage (0-100)'
        required: false
        type: string
        default: '100'
      skip_purge:
        description: 'Skip the CDN cache purge (NOT recommended: without it users keep downloading the previous build)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: r2-publish-${{ github.event_name }}-${{ inputs.version || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  preflight-index:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Test release metadata, signing, and index reconciliation
        run: |
          node --test \
            app/scripts/sign-release-manifest.test.mjs \
            app/scripts/verify-version-advance.test.mjs \
            app/scripts/verify-version.test.mjs \
            app/scripts/build-release-metadata.test.mjs \
            app/scripts/r2-dist-sync.test.mjs \
            app/scripts/verify-plugin-index.test.mjs
      - name: Rehearse Manifest v2 generation and Ed25519 signing
        working-directory: app
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ver="$(node -p "require('./dsh-desktop-next/package.json').version")"
          channel="$(node --input-type=module -e "import { channelForVersion } from './scripts/verify-version-advance.mjs'; console.log(channelForVersion(process.argv[1]))" "$ver")"
          printf 'arm64' > "$tmp/OmniMux-${ver}-arm64.dmg"
          printf 'x64' > "$tmp/OmniMux-${ver}-x64.dmg"
          printf 'win' > "$tmp/OmniMux-${ver}-x64-Setup.exe"
          keys="$(node scripts/sign-release-manifest.mjs keygen)"
          pub="$(printf '%s' "$keys" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).publicKeyBase64)")"
          priv="$(printf '%s' "$keys" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).privateKeyBase64)")"
          OMNIMUX_UPDATE_SIGNING_PRIVATE_KEY="$priv" node scripts/build-release-metadata.mjs \
            --version "$ver" \
            --dir "$tmp" \
            --require-platforms mac-arm64,mac-x64,windows \
            --key-id k1 \
            --require-signature
          node scripts/sign-release-manifest.mjs verify \
            --input "$tmp/api/desktop/v2/${channel}.json" \
            --sig "$tmp/api/desktop/v2/${channel}.json.sig" \
            --public-key "$pub" \
            --key-id k1
      - uses: ./.github/actions/generate-market-index
        with:
          preflight: 'true'

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2

      - name: Resolve and validate release inputs
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MIN_SUPPORTED_VERSION: ${{ inputs.min_supported_version }}
          INPUT_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
          INPUT_URGENCY: ${{ inputs.urgency }}
        run: |
          set -euo pipefail
          raw="${INPUT_VERSION}"
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version input '$raw' is not a valid x.y.z (or x.y.z-tag) version"
            exit 1
          fi
          if [ -n "${INPUT_MIN_SUPPORTED_VERSION}" ]; then
            min_ver="${INPUT_MIN_SUPPORTED_VERSION#v}"
            if ! printf '%s' "$min_ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::min_supported_version '$INPUT_MIN_SUPPORTED_VERSION' is not a valid SemVer"
              exit 1
            fi
          fi
          if [ -n "${INPUT_ROLLOUT_PERCENTAGE}" ]; then
            if ! printf '%s' "${INPUT_ROLLOUT_PERCENTAGE}" | grep -Eq '^(0|[1-9][0-9]?|100)$'; then
              echo "::error::rollout_percentage '$INPUT_ROLLOUT_PERCENTAGE' must be an integer between 0 and 100"
              exit 1
            fi
          fi
          if [ "${INPUT_URGENCY}" != "normal" ] && [ "${INPUT_URGENCY}" != "critical" ]; then
            echo "::error::urgency '$INPUT_URGENCY' must be normal or critical"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      # Hard production guard: the CDN channel manifest only moves forward. This
      # fails before downloading or uploading anything when the requested version
      # is equal to or older than the live one, so a stale release can never
      # surface as a production downgrade. A partial archive upload touches no
      # live metadata, so it skips this gate.
      - name: Reject CDN version downgrade
        if: ${{ inputs.mode == 'publish' }}
        run: node scripts/verify-version-advance.mjs --version "${{ steps.version.outputs.version }}"

      - name: Reject incomplete platform set for publish
        if: ${{ inputs.mode == 'publish' && inputs.required_platforms != 'mac-arm64,mac-x64,windows' }}
        run: |
          echo "::error::publish mode requires exactly mac-arm64,mac-x64,windows; use mode=partial for an incomplete upload"
          exit 1

      - name: Download installers from the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$tag" --repo "${{ github.repository }}" --dir release-assets --pattern '*.dmg' --clobber
          gh release download "$tag" --repo "${{ github.repository }}" --dir release-assets --pattern '*.exe' --clobber
          echo "Downloaded assets:"
          ls -lh release-assets
          if [ "${INPUT_MODE}" = "publish" ]; then
            test -n "$(find release-assets -maxdepth 1 -name '*.dmg' -print -quit)" || { echo "::error::no .dmg asset attached to $tag"; exit 1; }
            test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)" || { echo "::error::no .exe asset attached to $tag"; exit 1; }
          else
            test -n "$(find release-assets -maxdepth 1 \( -name '*.dmg' -o -name '*.exe' \) -print -quit)" || { echo "::error::no installer asset attached to $tag"; exit 1; }
          fi

      - name: Generate release metadata (v1 + Manifest v2 + Ed25519 signature)
        if: ${{ inputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMNIMUX_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.OMNIMUX_UPDATE_SIGNING_PRIVATE_KEY }}
          OMNIMUX_UPDATE_SIGNING_KEY_ID: ${{ vars.OMNIMUX_UPDATE_SIGNING_KEY_ID || 'k1' }}
          OMNIMUX_UPDATE_PUBLIC_KEY: ${{ vars.OMNIMUX_UPDATE_PUBLIC_KEY }}
          INPUT_MIN_SUPPORTED_VERSION: ${{ inputs.min_supported_version }}
          INPUT_REQUIRED_PLATFORMS: ${{ inputs.required_platforms }}
          INPUT_URGENCY: ${{ inputs.urgency }}
          INPUT_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          notes_file="release-assets/release-notes.md"
          gh release view "$tag" --repo "${{ github.repository }}" --json body --jq '.body // ""' > "$notes_file" || : > "$notes_file"
          extra_args=()
          if [ -n "${INPUT_MIN_SUPPORTED_VERSION}" ]; then
            extra_args+=(--min-supported-version "${INPUT_MIN_SUPPORTED_VERSION#v}")
          fi
          if [ -n "${OMNIMUX_UPDATE_SIGNING_PRIVATE_KEY}" ]; then
            extra_args+=(--require-signature --key-id "${OMNIMUX_UPDATE_SIGNING_KEY_ID}")
          elif [ -n "${OMNIMUX_UPDATE_PUBLIC_KEY}" ]; then
            echo "::error::OMNIMUX_UPDATE_PUBLIC_KEY is configured, so OMNIMUX_UPDATE_SIGNING_PRIVATE_KEY is required (refusing unsigned publish that would leave stale .sig on CDN)."
            exit 1
          else
            echo "::warning::OMNIMUX_UPDATE_SIGNING_PRIVATE_KEY is not configured; Manifest v2 will be published unsigned until signing keys are provisioned."
          fi
          if [ -n "${INPUT_ROLLOUT_PERCENTAGE}" ]; then
            extra_args+=(--rollout-percentage "${INPUT_ROLLOUT_PERCENTAGE}")
          fi
          node scripts/build-release-metadata.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --dir release-assets \
            --require-platforms "${INPUT_REQUIRED_PLATFORMS}" \
            --urgency "${INPUT_URGENCY}" \
            --notes-file "$notes_file" \
            "${extra_args[@]}"

      - uses: ./.github/actions/generate-market-index
        if: ${{ inputs.mode == 'publish' }}

      - name: Sync market catalog assets to R2
        if: ${{ inputs.mode == 'publish' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          catalog_dir="../plugins/plugins/omnimux-market/catalog"
          if [ ! -d "$catalog_dir" ]; then
            echo "::error::$catalog_dir not present in the monorepo; market cover sync cannot run."
            exit 1
          fi
          node scripts/upload-market-assets.mjs --dir "$catalog_dir"

      - name: Upload to R2 (releases/v<version> + latest aliases + metadata)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are required to publish."
            exit 1
          fi
          # --skip-verify: the edge cache still serves the previous build until the
          # purge step below runs, so a post-upload verify here would race the cache.
          if [ "${INPUT_MODE}" = "partial" ]; then
            node scripts/r2-dist-sync.mjs upload \
              --dir release-assets \
              --version "${{ steps.version.outputs.version }}" \
              --partial \
              --skip-verify
          else
            node scripts/r2-dist-sync.mjs upload \
              --dir release-assets \
              --version "${{ steps.version.outputs.version }}" \
              --skip-verify
          fi

      - name: Purge the CDN cache for release aliases
        if: ${{ inputs.mode == 'publish' && !inputs.skip_purge }}
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "${CLOUDFLARE_PURGE_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "::error::CLOUDFLARE_PURGE_TOKEN / CLOUDFLARE_ZONE_ID are required; without them dl.omnimux.ai/releases/latest/* keeps serving the previous build."
            exit 1
          fi
          node scripts/cf-purge-cache.mjs --version "${{ steps.version.outputs.version }}"

      - name: Verify the published CDN
        if: ${{ inputs.mode == 'publish' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OMNIMUX_UPDATE_PUBLIC_KEY: ${{ vars.OMNIMUX_UPDATE_PUBLIC_KEY }}
          INPUT_REQUIRED_PLATFORMS: ${{ inputs.required_platforms }}
        run: |
          node scripts/r2-dist-sync.mjs verify \
            --version "${{ steps.version.outputs.version }}" \
            --required-platforms "${INPUT_REQUIRED_PLATFORMS}" \
            --verify-hashes \
            --require-v2
