name: Publish release assets to R2 (dl.omnimux.ai)

# Promotes an already-built GitHub Release to the Cloudflare R2 distribution
# bucket behind https://dl.omnimux.ai, then purges the CDN edge cache and
# verifies the live endpoints.
#
# This is the "re-publish / CDN sync only" path: it never rebuilds the desktop.
# It downloads the installers attached to an existing `v<version>` GitHub Release
# (arm64/x64 DMGs and the Windows x64 NSIS installer), regenerates
# `api/desktop/version-stable.json` from those exact bytes, uploads everything
# under `releases/v<version>/` plus the `releases/latest/*` aliases, purges the
# CDN cache for those aliases, and finally verifies the live download URLs.
#
# The CDN channel only moves forward: `verify-version-advance.mjs` runs before
# any download/upload and rejects a version that is equal to or older than the
# live `version-<channel>.json`. A rollback therefore means a forward-fix with a
# higher version, never re-pointing latest at an older build.
#
# `mode=publish` always requires all three platform hashes and is the only mode
# that writes `version-<channel>.json` and updates `releases/latest/*`.
# `mode=partial` only uploads the versioned archive under `releases/v<version>/`;
# it never touches latest aliases or channel manifests.
#
# Unlike the historical `r2-publish.yml` that lived under `app/.github/` (which
# Actions never read, and which pulled artifacts from a private fork), this
# workflow runs from the repository root and sources artifacts from this
# repository's own public GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 2.0.23, leading "v" optional)'
        required: true
        type: string
      mode:
        description: 'publish: full three-platform latest promotion; partial: upload releases/v<version>/ only (never latest or version-*.json)'
        required: true
        type: choice
        options: [publish, partial]
        default: publish
      required_platforms:
        description: 'Platforms expected for a publish (must be exactly mac-arm64,mac-x64,windows); ignored in partial mode'
        required: false
        type: string
        default: 'mac-arm64,mac-x64,windows'
      skip_purge:
        description: 'Skip the CDN cache purge (NOT recommended: without it users keep downloading the previous build)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: r2-publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2

      - name: Resolve and validate version
        id: version
        run: |
          raw="${{ inputs.version }}"
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version input '$raw' is not a valid x.y.z (or x.y.z-tag) version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      # Hard production guard: the CDN channel manifest only moves forward. This
      # fails before downloading or uploading anything when the requested version
      # is equal to or older than the live one, so a stale release can never
      # surface as a production downgrade. A partial archive upload touches no
      # live metadata, so it skips this gate.
      - name: Reject CDN version downgrade
        if: ${{ inputs.mode == 'publish' }}
        run: node scripts/verify-version-advance.mjs --version "${{ steps.version.outputs.version }}"

      - name: Reject incomplete platform set for publish
        if: ${{ inputs.mode == 'publish' && inputs.required_platforms != 'mac-arm64,mac-x64,windows' }}
        run: |
          echo "::error::publish mode requires exactly mac-arm64,mac-x64,windows; use mode=partial for an incomplete upload"
          exit 1

      - name: Download installers from the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$tag" --repo "${{ github.repository }}" --dir release-assets --pattern '*.dmg' --clobber
          gh release download "$tag" --repo "${{ github.repository }}" --dir release-assets --pattern '*.exe' --clobber
          echo "Downloaded assets:"
          ls -lh release-assets
          if [ "${{ inputs.mode }}" = "publish" ]; then
            test -n "$(find release-assets -maxdepth 1 -name '*.dmg' -print -quit)" || { echo "::error::no .dmg asset attached to $tag"; exit 1; }
            test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)" || { echo "::error::no .exe asset attached to $tag"; exit 1; }
          else
            test -n "$(find release-assets -maxdepth 1 \( -name '*.dmg' -o -name '*.exe' \) -print -quit)" || { echo "::error::no installer asset attached to $tag"; exit 1; }
          fi

      - name: Generate release metadata (api/desktop/version-stable.json)
        if: ${{ inputs.mode == 'publish' }}
        run: |
          node scripts/build-release-metadata.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --dir release-assets \
            --require-platforms "${{ inputs.required_platforms }}"

      - name: Generate plugin index
        if: ${{ inputs.mode == 'publish' }}
        run: node scripts/build-plugin-index.mjs

      - name: Sync market catalog assets to R2
        if: ${{ inputs.mode == 'publish' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          catalog_dir="../plugins/plugins/omnimux-market/catalog"
          if [ ! -d "$catalog_dir" ]; then
            echo "::error::$catalog_dir not present in the monorepo; market cover sync cannot run."
            exit 1
          fi
          node scripts/upload-market-assets.mjs --dir "$catalog_dir"

      - name: Upload to R2 (releases/v<version> + latest aliases + metadata)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are required to publish."
            exit 1
          fi
          # --skip-verify: the edge cache still serves the previous build until the
          # purge step below runs, so a post-upload verify here would race the cache.
          if [ "${{ inputs.mode }}" = "partial" ]; then
            node scripts/r2-dist-sync.mjs upload \
              --dir release-assets \
              --version "${{ steps.version.outputs.version }}" \
              --partial \
              --skip-verify
          else
            node scripts/r2-dist-sync.mjs upload \
              --dir release-assets \
              --version "${{ steps.version.outputs.version }}" \
              --skip-verify
          fi

      - name: Purge the CDN cache for release aliases
        if: ${{ inputs.mode == 'publish' && !inputs.skip_purge }}
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "${CLOUDFLARE_PURGE_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "::error::CLOUDFLARE_PURGE_TOKEN / CLOUDFLARE_ZONE_ID are required; without them dl.omnimux.ai/releases/latest/* keeps serving the previous build."
            exit 1
          fi
          node scripts/cf-purge-cache.mjs --version "${{ steps.version.outputs.version }}"

      - name: Verify the published CDN
        if: ${{ inputs.mode == 'publish' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/r2-dist-sync.mjs verify \
            --version "${{ steps.version.outputs.version }}" \
            --required-platforms "${{ inputs.required_platforms }}" \
            --verify-hashes
