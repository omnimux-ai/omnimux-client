name: Publish npm package (Trusted Publishing)

# Trusted Publishing (OIDC): GitHub Actions 用 OIDC 短时凭证向 npm 证明发布身份，
# CI 内 npm publish 不需要任何 npm token，也不需要人工 2FA，并自动生成 provenance。
# npm 端可信发布者必须与此文件一致：
#   Provider=GitHub Actions / Owner=omnimux-ai / Repository=omnimux-client
#   Workflow filename=publish.yml / Environment 留空
# 注意：本仓 plugins/ 是插件工作区根，workflow 的 run 步骤默认在该目录下执行。
# 版本 bump 仍走现有 PR + Merge Queue，合入后由维护者手动触发本 workflow。
#
# packages=all（默认）会展开 12 个活跃包；dry_run 默认 true。dry-run 下：
#   - 未发布版本走 npm publish --dry-run；
#   - 已发布版本（当前为 omnimux@0.1.8）走 npm pack --dry-run；
# 真实发布下：all 跳过已发布版本并给出 warning；显式点名已发布包会在 preflight 失败。
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "要发布的包（包名或 plugins/<name>，逗号分隔；all = 全部活跃包）"
        required: true
        default: all
        type: string
      dry_run:
        description: "只打包与校验，不真正发布（默认 true；真实发布需显式关闭）"
        required: false
        default: true
        type: boolean

# id-token: write 是 OIDC 必需权限；本 workflow 不引用任何 npm token secret。
# 这里只保留 contents: read + id-token: write，不引入 environment、packages: write
# 或任何 npm token；Trusted Publisher 四元组保持不变。
permissions:
  contents: read
  id-token: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# 统一工作区根在仓库根（S1）；各 job 的命令都从仓库根执行，包目录用仓库相对路径。

jobs:
  # 解析包选择 + npm 上是否已发布，生成 matrix。所有选择（单包/多包/all）都经过这里。
  plan:
    name: Plan release matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve release matrix
        id: matrix
        env:
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          plan="$(node plugins/scripts/publish-matrix.mjs --packages "$INPUT_PACKAGES" --dry-run "$INPUT_DRY_RUN")"
          matrix="$(PLAN="$plan" node -e 'const p=JSON.parse(process.env.PLAN); process.stdout.write(JSON.stringify(p.include))')"
          warnings="$(PLAN="$plan" node -e 'const p=JSON.parse(process.env.PLAN); for (const w of p.warnings) process.stdout.write(`::warning::${w}\n`)')"
          if [ -n "$warnings" ]; then printf '%s' "$warnings"; fi
          test "$matrix" != "[]" || {
            echo "::error::没有可发布的包（选中版本都已在 npm 发布，或选择为空）"
            exit 1
          }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "release matrix: $matrix"

  # 每包独立 job；job 级 concurrency 保证同包发布不会互相抢版本。
  # dry-run 允许并行；真实发布固定 max-parallel=1，并按依赖拓扑顺序执行，
  # 保证 omnimux-products 先于 omnimux-assets 发布。
  publish:
    name: ${{ matrix.action }} ${{ matrix.package }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: publish-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.dry_run && 4 || 1 }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      - name: Install npm 11 (Trusted Publishing needs >= 11.5.1)
        run: |
          npm install --global npm@11
          npm --version
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process'
          const raw = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim()
          const [major, minor, patch] = raw.split('.').map(Number)
          const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
          if (!supported) {
            console.error(`npm >= 11.5.1 is required for Trusted Publishing, got ${raw}`)
            process.exit(1)
          }
          JS

      - name: Release preflight (manifest + verify-publish-source + npm state)
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            pack-dry-run) node plugins/scripts/release-check.mjs "$PACKAGE_DIR" --allow-published ;;
            *) node plugins/scripts/release-check.mjs "$PACKAGE_DIR" ;;
          esac

      # GitHub 不保证 matrix 的执行顺序；assets 依赖本次才发布的 products@0.1.2。
      # 真实发布 assets 前显式等待 registry 可解析，避免只靠 max-parallel=1 的调度假设。
      - name: Wait for internal package dependency
        if: ${{ matrix.action == 'publish' && matrix.package == 'omnimux-assets' }}
        env:
          DEPENDENCY: "omnimux-products@^0.1.2"
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=60
          RETRY_DELAY_SECONDS=15
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if output="$(npm view "$DEPENDENCY" version --json 2>/dev/null)"; then
              echo "$DEPENDENCY is available: $output"
              exit 0
            fi
            echo "waiting for $DEPENDENCY ($attempt/$MAX_ATTEMPTS)"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$RETRY_DELAY_SECONDS"
            fi
          done
          echo "::error::$DEPENDENCY is still not published after $((MAX_ATTEMPTS * RETRY_DELAY_SECONDS / 60)) minutes; refusing to publish omnimux-assets"
          exit 1

      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Publish or pack without publishing
        env:
          PACKAGE_DIR: ${{ matrix.dir }}
          ACTION: ${{ matrix.action }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PACKAGE_DIR"
          # npm 拒绝不带 tag 的 prerelease（market 的 omni.N、workflow 的 rc.N）。
          # 显式 latest 保持安装链路的默认解析；legacy 的 omni dist-tag 不在本 PR 改动。
          case "$ACTION" in
            publish) npm publish --access public --tag latest ;;
            publish-dry-run) npm publish --access public --tag latest --dry-run ;;
            pack-dry-run) npm pack --dry-run ;;
            *) echo "::error::unknown release action: $ACTION"; exit 1 ;;
          esac

      # 只对真实发布做 registry 回查；dry-run / pack 不访问已发布版本。
      - name: Verify published package
        if: ${{ matrix.action == 'publish' }}
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          PACKAGE_DIR: ${{ matrix.dir }}
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process'
          import { join } from 'node:path'

          const name = process.env.PACKAGE
          const version = process.env.VERSION
          const dir = join(process.env.GITHUB_WORKSPACE, process.env.PACKAGE_DIR)
          const expectedGitHead = process.env.GITHUB_SHA
          const viewOnce = () => {
            try {
              return execFileSync('npm', ['view', `${name}@${version}`, 'dist.tarball', 'gitHead'], {
                cwd: dir,
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore']
              }).trim()
            } catch {
              return ''
            }
          }

          // npm 发布后 registry 传播实测约 2 分钟，CDN 边缘偶发更慢。给 15 分钟窗口，
          // 窗口用尽仍未可见时，因为上一步 npm publish 已 exit 0，可见性只是最终一致
          // 的滞后，故降级为 warning，不让一次成功的发布被判成 failure。name@version
          // 与 gitHead 的一致性校验在拿到 registry 数据后照常执行（不一致仍 hard fail）。
          const MAX_ATTEMPTS = 60
          const RETRY_DELAY_SECONDS = 15
          let output = ''
          for (let attempt = 1; attempt <= MAX_ATTEMPTS && !output; attempt += 1) {
            output = viewOnce()
            if (!output) {
              console.log(`waiting for the registry to expose ${name}@${version} (${attempt}/${MAX_ATTEMPTS})`)
              if (attempt < MAX_ATTEMPTS) {
                execFileSync('sleep', [String(RETRY_DELAY_SECONDS)])
              }
            }
          }
          if (!output) {
            const waitMinutes = (MAX_ATTEMPTS * RETRY_DELAY_SECONDS) / 60
            console.log(`::warning::registry still does not expose ${name}@${version} after ${waitMinutes} minutes; the package was published (the publish step succeeded) but propagation is lagging. Verify later with: npm view ${name}@${version} dist.tarball gitHead`)
            process.exit(0)
          }
          console.log(output)

          const [gitHead] = output.match(/[0-9a-f]{40}/g) ?? []
          if (!gitHead) throw new Error(`published ${name}@${version} has no gitHead`)
          if (expectedGitHead && gitHead !== expectedGitHead) {
            throw new Error(`gitHead ${gitHead} does not match workflow commit ${expectedGitHead}`)
          }
          console.log(`verified ${name}@${version} gitHead=${gitHead}`)
          JS
