name: Release

# macOS DMGs are built locally: Apple signing/notarization needs the local
# Developer ID keychain and the cloud 3-core runner cannot complete the signing
# walk without timing out. This workflow owns the reproducible Windows build and,
# in release mode, creates/updates the GitHub Release that receives the local
# macOS DMGs via `gh release upload`. R2/latest promotion is a separate,
# all-platform gate in `r2-publish.yml`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only: build the Windows installer as an Actions artifact; release: publish the Windows installer to the GitHub Release'
        required: true
        type: choice
        options: [build-only, release]
        default: build-only

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  # Reproducible release: reuse the committed (vendored) Agents-Anywhere artifact
  # (pinned by app/vendor/agents-anywhere/provenance.json) instead of chasing the
  # upstream main head, which may target a newer DSH line than this repo ships.
  DSH_AA_USE_VENDORED: '1'
  # Reproducible release: pin the bundled dshmarket to the committed (patched)
  # version in the root resolutions instead of following the npm latest tag.
  DSH_MARKET_USE_VENDORED: '1'

# Monorepo note: the desktop shell lives in app/ (Yarn workspace `dsh-desktop-next`).
# Every run step below executes with working-directory `app` unless stated, so
# relative paths (`scripts/*.mjs`, `dsh-desktop-next/dist/*`) resolve inside the
# desktop package, exactly as they did in the archived single-app repository.
jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Reject release builds outside main
        if: ${{ inputs.mode == 'release' && github.ref != 'refs/heads/main' }}
        shell: bash
        working-directory: .
        run: |
          echo "::error::release mode must be dispatched from main; github.ref=${{ github.ref }}"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Verify version consistency
        run: node scripts/verify-version.mjs
      - name: Verify release source is origin/main
        if: ${{ inputs.mode == 'release' }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::release build must run from the latest origin/main commit"
            exit 1
          }
          test -z "$(git status --porcelain --untracked-files=no)" || {
            echo "::error::release build worktree is dirty"
            exit 1
          }
      # The monorepo plugin workspace is a packaging input for the desktop shell.
      - name: Install plugin workspace dependencies
        working-directory: .
        shell: bash
        run: corepack pnpm install --frozen-lockfile
      - name: Build plugin workspace
        working-directory: .
        shell: bash
        run: corepack pnpm --dir plugins run build:all
      - name: Install desktop dependencies
        run: corepack yarn install --immutable
      - name: Refresh Agents Anywhere vendor
        run: corepack yarn aa:prepare-release
      - name: Refresh dshmarket package versions
        run: corepack yarn market:prepare
      - name: Build Windows installer (website unsigned)
        run: corepack yarn workspace dsh-desktop-next dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: OmniMux-win
          path: |
            app/dsh-desktop-next/dist/OmniMux-*.exe
          if-no-files-found: error
          retention-days: 14

  publish-win:
    needs: build-win
    if: ${{ inputs.mode == 'release' && github.ref == 'refs/heads/main' && needs.build-win.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: app/release-assets
          merge-multiple: true
      - name: Resolve version
        id: version
        run: |
          # The tag must name what was actually built. All build jobs package
          # dsh-desktop-next, so its manifest is the release version (not the root
          # manifest, which carries the retired shell version).
          next_version="$(node -p "require('./dsh-desktop-next/package.json').version")"
          tag="v${next_version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag ${tag} from dsh-desktop-next/package.json"
      - name: Verify release tag matches version
        run: node scripts/verify-version.mjs --tag "${{ steps.version.outputs.tag }}"
      - name: Generate plugin provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.next_version }}
        run: node scripts/build-plugin-provenance.mjs --out release-assets
      - name: Publish Windows GitHub Release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OmniMux ${{ steps.version.outputs.tag }}
          files: |
            app/release-assets/**/*.exe
            app/release-assets/plugin-provenance.json
          fail_on_unmatched_files: false
      - name: Report the required macOS steps
        run: |
          echo "::notice::Windows asset uploaded. Build signed/notarized macOS DMGs locally from the same commit, then:"
          echo "::notice::gh release upload ${{ steps.version.outputs.tag }} OmniMux-<version>-arm64.dmg OmniMux-<version>-x64.dmg -R ${{ github.repository }} --clobber"
          echo "::notice::Finally run the 'Publish release assets to R2' workflow with version=${{ steps.version.outputs.next_version }} and the required platforms."
