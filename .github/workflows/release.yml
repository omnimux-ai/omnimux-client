name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options: [mac, win, both]
        default: 'both'
      skip_cdn:
        description: 'Publish the GitHub Release only, leaving dl.omnimux.ai on the previous build (no CDN update, no auto-update for installed clients)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

# Monorepo note: the desktop shell lives in app/ (Yarn workspace `dsh-desktop-next`).
# Every run step below executes with working-directory `app`, so relative paths
# (`scripts/*.mjs`, `dsh-desktop-next/dist/*`) resolve inside the desktop package,
# exactly as they did in the archived single-app repository.
jobs:
  build-mac:
    if: ${{ inputs.platform == 'mac' || inputs.platform == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Verify version consistency
        run: node scripts/verify-version.mjs
      - name: Install dependencies
        run: corepack yarn install --immutable
      # The AA vendor snapshot must match the latest upstream main commit, so the
      # runner refreshes it in place instead of failing the build.
      - name: Refresh Agents Anywhere vendor
        run: corepack yarn aa:prepare-release
      - name: Refresh dshmarket package versions
        run: corepack yarn market:prepare
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > developerID_application.p12
          security create-keychain -p "github-actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "github-actions" build.keychain
          security import developerID_application.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "github-actions" build.keychain
          security find-identity -v build.keychain
      - name: Build macOS release (universal DMG, signed + notarized)
        env:
          CSC_NAME: 'Yuhang Zhong (XXK6GHRZ44)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: corepack yarn workspace dsh-desktop-next dist:mac
      - name: Notarize macOS universal DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg_path="$(find dsh-desktop-next/dist/mac-release -name 'OmniMux-*-universal.dmg' | head -1)"
          if [ -z "$dmg_path" ]; then
            echo "::error::universal DMG not found for notarization"
            exit 1
          fi
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --timeout 7200
          xcrun stapler staple "$dmg_path"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: OmniMux-mac-universal
          path: |
            app/dsh-desktop-next/dist/mac-release/*universal*.dmg
          if-no-files-found: error
          retention-days: 14

  build-win:
    if: ${{ inputs.platform == 'win' || inputs.platform == 'both' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Verify version consistency
        run: node scripts/verify-version.mjs
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Refresh Agents Anywhere vendor
        run: corepack yarn aa:prepare-release
      - name: Refresh dshmarket package versions
        run: corepack yarn market:prepare
      - name: Build Windows installer (website unsigned)
        run: corepack yarn workspace dsh-desktop-next dist:win
      - name: Verify Windows installer
        run: corepack yarn workspace dsh-desktop-next check:win-package
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: OmniMux-win
          path: |
            app/dsh-desktop-next/dist/OmniMux-*.exe
            app/dsh-desktop-next/dist/OmniMux-*.zip
          if-no-files-found: error
          retention-days: 14

  # Publish to GitHub Releases + Cloudflare R2 (dl.omnimux.ai).
  # The market catalog images come from this monorepo's own plugin source
  # (plugins/plugins/omnimux-market/catalog).
  publish:
    needs: [build-mac, build-win]
    if: ${{ always() && (needs.build-mac.result == 'success' || needs.build-win.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Refresh Agents Anywhere vendor
        run: corepack yarn aa:prepare-release
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: app/release-assets
          merge-multiple: true
      - name: Resolve version
        id: version
        run: |
          # The tag must name what was actually built. All build jobs package
          # dsh-desktop-next, so its manifest is the release version (not the root
          # manifest, which carries the retired shell version).
          next_version="$(node -p "require('./dsh-desktop-next/package.json').version")"
          tag="v${next_version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag ${tag} from dsh-desktop-next/package.json"
      - name: Generate release metadata
        run: |
          node scripts/build-release-metadata.mjs \
            --version "${{ steps.version.outputs.next_version }}" \
            --dir release-assets
      - name: Generate plugin index
        run: node scripts/build-plugin-index.mjs
      - name: Generate plugin provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.next_version }}
        run: node scripts/build-plugin-provenance.mjs --out release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OmniMux ${{ steps.version.outputs.tag }}
          files: |
            app/release-assets/**/*.dmg
            app/release-assets/**/*.exe
            app/release-assets/**/*.zip
            app/release-assets/plugin-provenance.json
          fail_on_unmatched_files: false
      - name: Sync to Cloudflare R2 (dl.omnimux.ai)
        if: ${{ !inputs.skip_cdn }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Missing credentials are a FAILURE, not a warning: the landing page and
          # the in-app updater both read dl.omnimux.ai, so a green release with an
          # empty CDN leaves every user on the previous build with nobody notified.
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are required to publish."
            echo "dl.omnimux.ai would stay on the previous build while this release reports success."
            echo "Set both repository secrets, or re-run with the skip_cdn input to publish the GitHub Release only."
            exit 1
          fi
          node scripts/r2-dist-sync.mjs upload --dir release-assets
      - name: Sync market catalog assets to R2
        if: ${{ !inputs.skip_cdn }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Market catalog images live in this monorepo's plugin source.
          catalog_dir="../plugins/plugins/omnimux-market/catalog"
          if [ -d "$catalog_dir" ]; then
            node scripts/upload-market-assets.mjs --dir "$catalog_dir"
          else
            echo "::error::$catalog_dir not present in the monorepo; market cover sync cannot run."
            exit 1
          fi
      - name: Purge the CDN cache for release aliases
        if: ${{ !inputs.skip_cdn }}
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          artifact_version="$(node -p "require('./dsh-desktop-next/package.json').version")"
          if ! node scripts/cf-purge-cache.mjs --version "$artifact_version"; then
            echo "::error::CDN cache purge failed. Set CLOUDFLARE_PURGE_TOKEN (Zone → Cache Purge) and CLOUDFLARE_ZONE_ID. Until it succeeds dl.omnimux.ai/releases/latest/* keeps serving the previous build."
            exit 1
          fi
      - name: Verify the published CDN
        if: ${{ !inputs.skip_cdn }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          artifact_version="$(node -p "require('./dsh-desktop-next/package.json').version")"
          node scripts/r2-dist-sync.mjs verify --version "$artifact_version"
      - name: Report an intentionally CDN-less publish
        if: ${{ inputs.skip_cdn }}
        run: |
          echo "::warning::skip_cdn was set: the GitHub Release is published but dl.omnimux.ai was NOT updated."
          echo "Landing-page downloads and in-app auto-update still point at the previous build."
