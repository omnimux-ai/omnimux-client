name: Bug Report
description: Report a bug in the OmniMux desktop app or product plugins
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please search [existing issues](https://github.com/omnimux-ai/omnimux-client/issues) first, and **do not paste API keys, tokens, or personal credentials** below.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x64)
        - Windows (x64)
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OmniMux Version
      description: Check the app About dialog or release tag (e.g. v2.0.25) or commit SHA if built from source.
      placeholder: "v2.0.25"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component / Plugin
      options:
        - Desktop Shell (app / installers / updates)
        - Execution Hub & Model Routing (omnimux)
        - Workflow Canvas (omnimux-workflow)
        - Clip Studio (omnimux-clip)
        - Product Library (omnimux-products)
        - Asset Library (omnimux-assets)
        - Inspiration Library (omnimux-inspiration)
        - Browser Companion (omnimux-browser)
        - Plugin & Skill Market (omnimux-market)
        - Accounts / Publishing / Analytics (beta)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or redacted logs (optional)
      description: Attach screenshots or relevant error output with any secrets, tokens, or private URLs removed.

  - type: checkboxes
    id: hygiene
    attributes:
      label: Checklist
      options:
        - label: I have removed any API keys, tokens, and personal data from this report.
          required: true
        - label: This is not a security vulnerability (for security reports, see SECURITY.md).
          required: true
