packages:
  - plugins
  - plugins/plugins/*
  - plugins/plugins/omnimux-browser/extension
  - plugins/packages/*

# The hub plugin declares the shared UI kit by published semver range so
# `pnpm pack`/`pnpm publish` ship a real range instead of a machine-local
# `file:` path; this keeps that range resolving to the in-repo kit in dev.
linkWorkspacePackages: true

peerDependencyRules:
  allowedVersions:
    "@deepseek-ai/dsh-*": "0.2.2-rc.5"
    "@deepseek-ai/cordis": "4.1.0"

overrides:
  '@deepseek-ai/dsh-*': 0.2.2-rc.5

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  # Clip bundles the browser entry of Transformers and does not use its native backends.
  onnxruntime-node@1.21.0: false
  protobufjs: false
  sharp@0.34.5: false
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - aigc-provider-runtime-kit@0.2.0
  - blobatar@0.2.0
