desc-en: "Global Ad Localizer turns validated product ads into multicultural, multilingual video matrices for international markets. It separates locked product and brand facts from market-specific personas, scenes, and compliance checks, then validates a single sample before scaling across regions with OmniMux native media workflows."
desc-cn: "多语言出海视频广告技能负责将验证过的商品广告创意扩展为多国家、多语言、多平台语境的高转化出海视频矩阵。通过四栏本地化拆解锁定商品外观与品牌事实真源，重塑目标市场人设与使用场景，并遵循先提案、单条小样核验再扩量的 OmniMux 多模态制作流程。"
